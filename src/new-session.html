<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>New Session - Biathlon Shooting Assistant</title>
    <link rel="manifest" href="manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="assets/icons/app-icon.png" />

    <link rel="icon" href="assets/icons/app-icon.png" type="image/png" />

    <meta name="theme-color" content="#000000" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/global/global.css" />

    <link rel="stylesheet" href="css/pages/new-session.css" />

    <link rel="stylesheet" href="css/global/desktop.css" />
    <script src="js/core/config.js"></script>
    <script src="js/utils/dynamic-selects.js"></script>
    <script src="js/core/theme-manager.js"></script>
    <script src="js/services/api-service.js"></script>
    <script src="js/services/auth-guard.js"></script>
    <script src="js/core/tailwind-config.js"></script>
  </head>
  <body class="text-off-white min-h-screen flex justify-center items-start transition-colors">
    <div
      id="app-container"
      class="w-full max-w-[430px] fixed inset-0 mx-auto md:relative md:inset-auto md:h-screen bg-deep-charcoal overflow-hidden flex flex-col shadow-2xl md:rounded-[55px] md:border-[8px] md:border-zinc-800"
    >
      <div id="desktop-main-content" class="flex flex-col flex-1 min-h-0">
        <div
          class="status-bar px-8 pt-1 pb-1 flex justify-between items-center text-base font-semibold text-off-white"
        ></div>
        <header class="px-6 pt-1 pb-4 border-b border-subtle">
          <div class="flex items-center gap-4">
            <a href="index.html" class="p-2 -ml-2 text-off-white/70 active:scale-90 transition-all">
              <span class="material-symbols-outlined text-[28px]">arrow_back_ios_new</span>
            </a>
            <h1
              class="text-2xl font-bold tracking-tight text-off-white"
              data-i18n="create_new_session"
            ></h1>
          </div>
        </header>

        <main class="flex-1 overflow-y-auto px-6 py-4 space-y-4 no-scrollbar">
          <div class="bg-card-dark rounded-2xl p-5 space-y-2 border border-subtle">
            <div class="relative">
              <input
                id="sessionName"
                class="w-full px-4 py-3.5 bg-off-white/5 border border-subtle rounded-xl focus:ring-2 focus:ring-primary/50 focus:border-transparent outline-none text-off-white placeholder-light-blue-info/50 text-sm transition-all"
                type="text"
                maxlength="50"
                data-i18n="session_name"
                autocomplete="off"
              />
              <div
                id="sessionNameHistory"
                class="mt-1 flex flex-wrap items-center justify-between gap-1 hidden px-2 py-1 bg-white/[0.02] rounded-lg"
              >
                <div class="flex flex-wrap gap-1" id="sessionNameChips"></div>
                <span class="text-[10px] text-light-blue-info font-medium whitespace-nowrap ml-auto"
                  ><span id="nameCount">0</span>/50</span
                >
              </div>
            </div>
            <div class="relative">
              <input
                id="sessionLocation"
                class="w-full px-4 py-3.5 bg-off-white/5 border border-subtle rounded-xl focus:ring-2 focus:ring-primary/50 focus:border-transparent outline-none text-off-white placeholder-light-blue-info/50 text-sm transition-all"
                type="text"
                maxlength="30"
                data-i18n="location"
                autocomplete="off"
              />
              <div
                id="sessionLocationHistory"
                class="mt-1 flex flex-wrap items-center justify-between gap-1 hidden px-2 py-1 bg-white/[0.02] rounded-lg"
              >
                <div class="flex flex-wrap gap-1" id="sessionLocationChips"></div>
                <span class="text-[10px] text-light-blue-info font-medium whitespace-nowrap ml-auto"
                  ><span id="locationCount">0</span>/30</span
                >
              </div>
            </div>
            <div class="flex gap-4 pt-1">
              <div class="relative flex-1">
                <input
                  id="sessionDate"
                  class="w-full px-4 py-3.5 bg-off-white/5 border border-subtle rounded-xl focus:ring-2 focus:ring-primary/50 outline-none text-off-white text-sm transition-all"
                  type="date"
                  title="Session Date"
                />
              </div>
              <div class="relative flex-1">
                <input
                  id="sessionTime"
                  class="w-full px-4 py-3.5 bg-off-white/5 border border-subtle rounded-xl focus:ring-2 focus:ring-primary/50 outline-none text-off-white text-sm transition-all"
                  type="time"
                  title="Session Time"
                />
              </div>
            </div>
            <div class="relative">
              <select
                id="sessionType"
                class="w-full px-4 py-3.5 bg-off-white/5 border border-subtle rounded-xl focus:ring-2 focus:ring-primary/50 focus:border-transparent outline-none appearance-none text-sm text-off-white cursor-pointer"
              >
                <option disabled selected value="" data-i18n="session_type_placeholder"></option>
                <option value="training" data-i18n="training"></option>
                <option value="competition" data-i18n="competitions"></option>
                <option value="test_competition" data-i18n="test_competition"></option>
                <option value="international_test" data-i18n="international_test"></option>
                <option value="other" data-i18n="other"></option>
                <option value="testing" data-i18n="testing"></option>
              </select>
              <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
                <span class="material-symbols-outlined text-light-blue-info">expand_more</span>
              </div>
            </div>
            <div
              id="competitionFields"
              class="hidden space-y-4 animate-in fade-in slide-in-from-top-2 duration-300"
            >
              <div id="competitionCategoryField" class="relative">
                <select
                  id="competitionCategory"
                  class="w-full px-4 py-3.5 bg-off-white/5 border border-subtle rounded-xl focus:ring-2 focus:ring-primary/50 outline-none appearance-none text-sm text-off-white cursor-pointer"
                >
                  <option disabled selected value="" data-i18n="event_category"></option>
                  <option value="Alpencup">Alpencup</option>
                  <option value="Deutschlandpokal">Deutschlandpokal</option>
                  <option value="Weltcup">Weltcup</option>
                  <option value="IBU Cup">IBU Cup</option>
                </select>
                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
                  <span class="material-symbols-outlined text-light-blue-info">emoji_events</span>
                </div>
              </div>
              <div class="relative">
                <select
                  id="competitionType"
                  class="w-full px-4 py-3.5 bg-off-white/5 border border-subtle rounded-xl focus:ring-2 focus:ring-primary/50 outline-none appearance-none text-sm text-off-white cursor-pointer"
                >
                  <option disabled selected value="" data-i18n="race_type"></option>
                  <option value="Sprint" data-i18n="sprint"></option>
                  <option value="Pursuit" data-i18n="pursuit"></option>
                  <option value="Individual" data-i18n="individual"></option>
                  <option value="Mass Start" data-i18n="mass_start"></option>
                  <option value="Relay" data-i18n="relay"></option>
                  <option value="Single Mixed Relay" data-i18n="single_mixed_relay"></option>
                  <option value="Mixed Relay" data-i18n="mixed_relay"></option>
                  <option value="other" data-i18n="other"></option>
                </select>
                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
                  <span class="material-symbols-outlined text-light-blue-info">category</span>
                </div>
              </div>
            </div>
            <div
              id="trainingTemplateFields"
              class="hidden space-y-4 animate-in fade-in slide-in-from-top-2 duration-300"
            >
              <div class="relative">
                <select
                  id="trainingTemplate"
                  class="w-full px-4 py-3.5 bg-off-white/5 border border-subtle rounded-xl focus:ring-2 focus:ring-primary/50 outline-none appearance-none text-sm text-off-white cursor-pointer"
                >
                  <option disabled selected value="" data-i18n="select_template"></option>
                </select>
                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
                  <span class="material-symbols-outlined text-light-blue-info">library_books</span>
                </div>
              </div>
            </div>
          </div>

          <div class="bg-card-dark rounded-2xl border border-subtle overflow-hidden">
            <div
              onclick="toggleConditions()"
              class="p-5 flex justify-between items-center cursor-pointer active:opacity-80 transition-all bg-white/[0.02]"
            >
              <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-neon-cyan">partly_cloudy_day</span>
                <span class="text-off-white font-bold" data-i18n="weather_track_conditions"></span>
              </div>
              <span
                id="conditions-chevron"
                class="material-symbols-outlined text-light-blue-info transition-transform duration-300"
                >expand_more</span
              >
            </div>
            <div
              id="conditions-content"
              class="hidden p-5 pt-0 space-y-4 animate-in fade-in slide-in-from-top-2 duration-300"
            >
              <div class="flex items-center gap-2 pt-1">
                <span class="material-symbols-outlined text-neon-cyan text-[18px]">thermostat</span>
                <span
                  class="text-off-white font-bold text-sm"
                  data-i18n="weather_conditions"
                ></span>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1.5">
                  <label
                    class="text-[10px] uppercase font-black text-light-blue-info tracking-wider ml-1"
                    data-i18n="temperature"
                  ></label>
                  <div class="relative">
                    <input
                      id="tempInput"
                      type="number"
                      step="0.5"
                      class="w-full px-4 py-3 bg-off-white/5 border border-subtle rounded-xl text-sm text-off-white outline-none focus:ring-1 focus:ring-neon-cyan/50"
                      placeholder="0.0"
                    />
                    <span
                      class="absolute right-3 top-1/2 -translate-y-1/2 text-light-blue-info/50 text-[10px] font-bold"
                      >°C</span
                    >
                  </div>
                </div>
                <div class="space-y-1.5">
                  <label
                    class="text-[10px] uppercase font-black text-light-blue-info tracking-wider ml-1"
                    data-i18n="sky_conditions"
                  ></label>
                  <div class="relative">
                    <select
                      id="skyInput"
                      class="w-full px-4 py-3 bg-off-white/5 border border-subtle rounded-xl text-sm text-off-white outline-none appearance-none cursor-pointer"
                    >
                      <option value="sunny" data-i18n="sunny"></option>
                      <option value="cloudy" data-i18n="cloudy"></option>
                      <option value="overcast" data-i18n="overcast"></option>
                      <option value="foggy" data-i18n="foggy"></option>
                    </select>
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                      <span class="material-symbols-outlined text-light-blue-info text-xs"
                        >expand_more</span
                      >
                    </div>
                  </div>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1.5">
                  <label
                    class="text-[10px] uppercase font-black text-light-blue-info tracking-wider ml-1"
                    data-i18n="precipitation"
                  ></label>
                  <div class="relative">
                    <select
                      id="precipitationInput"
                      class="w-full px-4 py-3 bg-off-white/5 border border-subtle rounded-xl text-sm text-off-white outline-none appearance-none cursor-pointer"
                    >
                      <option value="no_precipitation" data-i18n="no_precipitation"></option>
                      <option value="dry" data-i18n="dry"></option>
                      <option value="sleet" data-i18n="sleet"></option>
                      <option value="rainy" data-i18n="rainy"></option>
                      <option value="snowing" data-i18n="snowing"></option>
                    </select>
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                      <span class="material-symbols-outlined text-light-blue-info text-xs"
                        >expand_more</span
                      >
                    </div>
                  </div>
                </div>
                <div class="space-y-1.5">
                  <label
                    class="text-[10px] uppercase font-black text-light-blue-info tracking-wider ml-1"
                    data-i18n="humidity"
                  ></label>
                  <div class="relative">
                    <select
                      id="humidityInput"
                      class="w-full px-4 py-3 bg-off-white/5 border border-subtle rounded-xl text-sm text-off-white outline-none appearance-none cursor-pointer"
                    >
                      <option value="low_humidity" data-i18n="low_humidity"></option>
                      <option value="no_humidity" data-i18n="no_humidity"></option>
                      <option value="moderate_humidity" data-i18n="moderate_humidity"></option>
                      <option value="high_humidity" data-i18n="high_humidity"></option>
                      <option value="very_high_humidity" data-i18n="very_high_humidity"></option>
                    </select>
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                      <span class="material-symbols-outlined text-light-blue-info text-xs"
                        >expand_more</span
                      >
                    </div>
                  </div>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1.5">
                  <label
                    class="text-[10px] uppercase font-black text-light-blue-info tracking-wider ml-1"
                    data-i18n="wind_strength"
                  ></label>
                  <div class="relative">
                    <select
                      id="windStrengthInput"
                      class="w-full px-4 py-3 bg-off-white/5 border border-subtle rounded-xl text-sm text-off-white outline-none appearance-none cursor-pointer"
                    >
                      <option value="" selected data-i18n="optional_no_entry"></option>
                      <option value="none" data-i18n="none"></option>
                      <option value="light" data-i18n="light"></option>
                      <option value="moderate" data-i18n="moderate"></option>
                      <option value="strong" data-i18n="strong"></option>
                      <option value="stormy" data-i18n="stormy"></option>
                    </select>
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                      <span class="material-symbols-outlined text-light-blue-info text-xs"
                        >expand_more</span
                      >
                    </div>
                  </div>
                </div>
                <div class="space-y-1.5">
                  <label
                    class="text-[10px] uppercase font-black text-light-blue-info tracking-wider ml-1"
                    data-i18n="wind_direction"
                  ></label>
                  <div class="relative">
                    <select
                      id="windDirectionInput"
                      class="w-full px-4 py-3 bg-off-white/5 border border-subtle rounded-xl text-sm text-off-white outline-none appearance-none cursor-pointer"
                    >
                      <option value="" selected data-i18n="optional_no_entry"></option>
                      <option value="none" data-i18n="none">None</option>
                      <option value="N">N</option>
                      <option value="NE">NE</option>
                      <option value="E">E</option>
                      <option value="SE">SE</option>
                      <option value="S">S</option>
                      <option value="SW">SW</option>
                      <option value="W">W</option>
                      <option value="NW">NW</option>
                    </select>
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                      <span class="material-symbols-outlined text-light-blue-info text-xs"
                        >expand_more</span
                      >
                    </div>
                  </div>
                </div>
              </div>
              <div class="h-px bg-subtle my-1"></div>
              <div class="flex items-center gap-2 pt-1">
                <span class="material-symbols-outlined text-neon-cyan text-[18px]">terrain</span>
                <span class="text-off-white font-bold text-sm" data-i18n="track_conditions"></span>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1.5">
                  <label
                    class="text-[10px] uppercase font-black text-light-blue-info tracking-wider ml-1"
                    data-i18n="snow_type"
                  ></label>
                  <div class="relative">
                    <select
                      id="snowTypeInput"
                      class="w-full px-4 py-3 bg-off-white/5 border border-subtle rounded-xl text-sm text-off-white outline-none appearance-none cursor-pointer"
                    >
                      <option value="mixed_snow" data-i18n="mixed_snow"></option>
                      <option value="fine_snow" data-i18n="fine_snow"></option>
                      <option value="converted_snow" selected data-i18n="converted_snow"></option>
                      <option value="powder_snow" data-i18n="powder_snow"></option>
                      <option value="new_snow" data-i18n="new_snow"></option>
                      <option value="old_snow" data-i18n="old_snow"></option>
                      <option value="artificial_snow" data-i18n="artificial_snow"></option>
                      <option value="icy" data-i18n="icy"></option>
                    </select>
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                      <span class="material-symbols-outlined text-light-blue-info text-xs"
                        >expand_more</span
                      >
                    </div>
                  </div>
                </div>
                <div class="space-y-1.5">
                  <label
                    class="text-[10px] uppercase font-black text-light-blue-info tracking-wider ml-1"
                    data-i18n="surface_moisture"
                  ></label>
                  <div class="relative">
                    <select
                      id="surfaceMoistureInput"
                      class="w-full px-4 py-3 bg-off-white/5 border border-subtle rounded-xl text-sm text-off-white outline-none appearance-none cursor-pointer"
                    >
                      <option value="dry" data-i18n="dry"></option>
                      <option value="moist" data-i18n="moist"></option>
                      <option value="wet" data-i18n="wet"></option>
                      <option value="slushy" data-i18n="slushy"></option>
                      <option value="muddy" data-i18n="muddy"></option>
                    </select>
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                      <span class="material-symbols-outlined text-light-blue-info text-xs"
                        >expand_more</span
                      >
                    </div>
                  </div>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1.5">
                  <label
                    class="text-[10px] uppercase font-black text-light-blue-info tracking-wider ml-1"
                    data-i18n="track_hardness"
                  ></label>
                  <div class="relative">
                    <select
                      id="trackHardnessInput"
                      class="w-full px-4 py-3 bg-off-white/5 border border-subtle rounded-xl text-sm text-off-white outline-none appearance-none cursor-pointer"
                    >
                      <option value="hard" data-i18n="hard"></option>
                      <option value="medium" data-i18n="medium"></option>
                      <option value="soft" data-i18n="soft"></option>
                      <option value="loose" data-i18n="loose"></option>
                      <option value="rutted" data-i18n="rutted"></option>
                    </select>
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                      <span class="material-symbols-outlined text-light-blue-info text-xs"
                        >expand_more</span
                      >
                    </div>
                  </div>
                </div>
                <div class="space-y-1.5">
                  <label
                    class="text-[10px] uppercase font-black text-light-blue-info tracking-wider ml-1"
                    data-i18n="snow_grain"
                  ></label>
                  <div class="relative">
                    <select
                      id="snowGrainInput"
                      class="w-full px-4 py-3 bg-off-white/5 border border-subtle rounded-xl text-sm text-off-white outline-none appearance-none cursor-pointer"
                    >
                      <option value="fine_grained" selected data-i18n="fine_grained"></option>
                      <option value="middle_grained" data-i18n="middle_grained"></option>
                      <option value="rough_grained" data-i18n="rough_grained"></option>
                      <option value="mixed_grained" data-i18n="mixed_grained"></option>
                    </select>
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                      <span class="material-symbols-outlined text-light-blue-info text-xs"
                        >expand_more</span
                      >
                    </div>
                  </div>
                </div>
              </div>
              <div class="space-y-1.5">
                <label
                  class="text-[10px] uppercase font-black text-light-blue-info tracking-wider ml-1"
                  data-i18n="track_preparation"
                ></label>
                <div class="relative">
                  <select
                    id="trackPreparationInput"
                    class="w-full px-4 py-3 bg-off-white/5 border border-subtle rounded-xl text-sm text-off-white outline-none appearance-none cursor-pointer"
                  >
                    <option value="" selected data-i18n="optional_no_entry"></option>
                    <option value="freshly_prepared" data-i18n="freshly_prepared"></option>
                    <option value="partly_prepared" data-i18n="partly_prepared"></option>
                    <option value="not_prepared" data-i18n="not_prepared"></option>
                  </select>
                  <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                    <span class="material-symbols-outlined text-light-blue-info text-xs"
                      >expand_more</span
                    >
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="bg-card-dark rounded-2xl p-5 border border-subtle">
            <div class="flex justify-between items-center mb-4">
              <div>
                <h2 class="text-off-white font-bold text-base" data-i18n="athletes"></h2>
                <p class="text-[11px] text-light-blue-info/70">
                  <span id="selectedAthleteCount">0</span>
                  <span data-i18n="selected_label"></span>
                </p>
              </div>
              <button
                id="toggleAthletesBtn"
                class="p-2 bg-primary/10 text-primary rounded-xl active:scale-90 transition-all border border-primary/20"
              >
                <span class="material-symbols-outlined">person_add</span>
              </button>
            </div>
            <div id="selectedAthletesList" class="space-y-2">
              <p
                class="text-xs text-light-blue-info/40 italic px-1"
                data-i18n="add_athletes_placeholder"
              ></p>
            </div>
          </div>

          <div class="bg-card-dark rounded-2xl p-5 border border-subtle">
            <button
              type="button"
              onclick="toggleSessionNote()"
              class="w-full flex items-center justify-between"
            >
              <div>
                <h2
                  class="text-off-white font-bold text-base text-left"
                  data-i18n="session_note"
                ></h2>
              </div>
              <span
                id="session-note-chevron"
                class="material-symbols-outlined text-light-blue-info transition-transform duration-200"
                >expand_more</span
              >
            </button>

            <div id="session-note-content" class="hidden mt-4">
              <textarea
                id="sessionNote"
                rows="4"
                maxlength="1000"
                class="w-full px-4 py-3 bg-off-white/5 border border-subtle rounded-xl text-sm text-off-white placeholder-light-blue-info/40 focus:ring-2 focus:ring-primary/50 outline-none transition-all resize-y min-h-[104px]"
                data-i18n="session_note_placeholder"
              ></textarea>
            </div>
          </div>

          <div id="form-actions" class="py-6 flex gap-3">
            <button
              id="createSessionBtn"
              class="flex-[2] bg-primary active:scale-[0.96] active:brightness-90 text-white font-bold py-5 rounded-2xl shadow-lg shadow-primary/25 transition-all text-base flex items-center justify-center"
              data-i18n="create_session"
            ></button>
          </div>
        </main>

      </div>

      <div
        id="athletesModal"
        class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50"
      >
        <div
          class="bg-card-dark rounded-[32px] p-6 w-[92%] max-h-[80vh] flex flex-col border border-subtle shadow-2xl space-y-4"
        >
          <div class="flex justify-between items-center shrink-0">
            <h2 class="text-xl font-bold text-off-white" data-i18n="select_athletes"></h2>
            <button
              id="closeAthletesModal"
              class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 text-off-white/50 active:scale-90 transition-all"
            >
              <span class="material-symbols-outlined">close</span>
            </button>
          </div>
          <div class="relative shrink-0">
            <span
              class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-light-blue-info text-[20px]"
              >search</span
            >
            <input
              id="athleteSearch"
              class="w-full pl-12 pr-4 py-4 bg-off-white/5 border border-subtle rounded-2xl text-sm text-off-white placeholder-light-blue-info/40 focus:ring-2 focus:ring-primary/50 outline-none transition-all"
              type="text"
              data-i18n="search_name"
            />
          </div>
          <div
            id="athleteFilters"
            class="flex gap-2 overflow-x-auto pb-1 no-scrollbar -mx-1 px-1 shrink-0"
          ></div>
          <div
            id="athletesSelectList"
            class="flex-1 overflow-y-auto space-y-2 no-scrollbar py-1"
          ></div>
          <button
            id="confirmAthletesBtn"
            class="w-full px-6 py-4 bg-primary text-white font-bold rounded-2xl active:scale-95 transition-all shadow-lg shadow-primary/20 shrink-0"
            data-i18n="confirm_selection"
          ></button>
        </div>
      </div>
    </div>
    <script src="js/core/lang.js"></script>
    <script src="js/utils/utils.js"></script>
    <script src="js/managers/training-template-manager.js"></script>
    <script src="js/pages/inline-1/new-session-inline-1.js"></script>
    <script src="js/pages/new-session.js"></script>
  </body>
</html>
