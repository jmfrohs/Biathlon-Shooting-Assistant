              <div class="relative">

                >

                    <span class="text-xs text-light-blue-info" data-i18n="view"></span>

                  <span

                  <button

                    data-view="week"
                    data-i18n="calendar_week"

                  <button

                    data-view="month"
                    data-i18n="calendar_month"

                </div>

                    />
