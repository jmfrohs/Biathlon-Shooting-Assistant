<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Biathlon Shooting Assistant</title>
    <link rel="manifest" href="manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="assets/icons/app-icon.png" />

    <link rel="icon" href="assets/icons/app-icon.png" type="image/png" />

    <meta name="theme-color" content="#000000" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/global/global.css" />

    <link rel="stylesheet" href="css/pages/athletes.css" />

    <link rel="stylesheet" href="css/global/desktop.css" />
    <script src="js/core/config.js"></script>
    <script src="js/core/theme-manager.js"></script>
    <script src="js/services/api-service.js"></script>
    <script src="js/services/auth-guard.js"></script>
    <script src="js/utils/dynamic-selects.js"></script>
    <script src="js/core/tailwind-config.js"></script>
  </head>
  <body class="text-off-white min-h-screen flex justify-center items-start">
    <div
      id="app-container"
      class="w-full max-w-[430px] fixed inset-0 mx-auto md:relative md:inset-auto md:h-screen bg-deep-charcoal overflow-hidden flex flex-col shadow-2xl md:rounded-[55px] md:border-[8px] md:border-zinc-800"
    >
      <div id="desktop-main-content" class="flex flex-col flex-1 min-h-0">
        <div
          class="status-bar px-8 pt-1 pb-1 flex justify-between items-center text-base font-semibold text-off-white"
        ></div>
        <header class="px-6 pt-1 pb-4">
          <div class="flex justify-between items-end">
            <div class="space-y-1">
              <h1
                class="text-3xl font-bold tracking-tight text-off-white"
                data-i18n="athletes"
              ></h1>
              <p class="text-sm text-light-blue-info font-medium" data-i18n="coach_account"></p>
            </div>
          </div>
        </header>
        <div class="px-6 py-2 space-y-5">
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span
                class="material-symbols-outlined text-light-blue-info/40 group-focus-within:text-primary transition-colors"
                >search</span
              >
            </div>
            <input
              type="text"
              id="searchInput"
              data-i18n="search_athletes_placeholder"
              class="block w-full pl-10 pr-4 py-3 bg-off-white/5 border border-subtle rounded-2xl text-sm text-off-white placeholder:text-light-blue-info/30 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
            />
          </div>

          <div id="filterButtons" class="flex gap-3 overflow-x-auto pb-1 no-scrollbar -mx-1 px-1">
            <button
              class="filter-btn px-6 py-2.5 bg-primary text-off-white text-sm font-bold rounded-full whitespace-nowrap active:opacity-80"
              data-filter="all"
            ></button>
            <button
              class="filter-btn px-6 py-2.5 bg-card-dark text-off-white text-sm font-semibold rounded-full whitespace-nowrap border border-subtle active:bg-off-white/5"
              data-filter="m"
            ></button>
            <button
              class="filter-btn px-6 py-2.5 bg-card-dark text-off-white text-sm font-semibold rounded-full whitespace-nowrap border border-subtle active:bg-off-white/5"
              data-filter="w"
            ></button>
            <button
              class="filter-btn px-6 py-2.5 bg-card-dark text-off-white text-sm font-semibold rounded-full whitespace-nowrap border border-subtle active:bg-off-white/5"
              data-filter="AK 16"
            ></button>
            <button
              class="filter-btn px-6 py-2.5 bg-card-dark text-off-white text-sm font-semibold rounded-full whitespace-nowrap border border-subtle active:bg-off-white/5"
              data-filter="AK 17"
            ></button>
            <button
              class="filter-btn px-6 py-2.5 bg-card-dark text-off-white text-sm font-semibold rounded-full whitespace-nowrap border border-subtle active:bg-off-white/5"
              data-filter="AK 18"
            ></button>
            <button
              class="filter-btn px-6 py-2.5 bg-card-dark text-off-white text-sm font-semibold rounded-full whitespace-nowrap border border-subtle active:bg-off-white/5"
              data-filter="Junioren"
            ></button>
            <button
              class="filter-btn px-6 py-2.5 bg-card-dark text-off-white text-sm font-semibold rounded-full whitespace-nowrap border border-subtle active:bg-off-white/5"
              data-filter="Senioren"
            ></button>
          </div>
        </div>

        <main class="flex-1 overflow-y-auto px-6 py-4 space-y-4 no-scrollbar">
          <div id="athletesList" class="space-y-3">
            <div
              class="animate-pulse bg-card-dark border border-subtle rounded-2xl p-4 flex items-center justify-between shadow-sm mb-3"
            >
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-off-white/10"></div>
                <div class="space-y-2">
                  <div class="h-4 bg-off-white/10 rounded w-32"></div>
                  <div class="h-3 bg-off-white/10 rounded w-24"></div>
                </div>
              </div>
              <div class="w-4 h-4 bg-off-white/10 rounded-full"></div>
            </div>
            <div
              class="animate-pulse bg-card-dark border border-subtle rounded-2xl p-4 flex items-center justify-between shadow-sm mb-3"
            >
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-off-white/10"></div>
                <div class="space-y-2">
                  <div class="h-4 bg-off-white/10 rounded w-28"></div>
                  <div class="h-3 bg-off-white/10 rounded w-20"></div>
                </div>
              </div>
              <div class="w-4 h-4 bg-off-white/10 rounded-full"></div>
            </div>
            <div
              class="animate-pulse bg-card-dark border border-subtle rounded-2xl p-4 flex items-center justify-between shadow-sm mb-3"
            >
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-off-white/10"></div>
                <div class="space-y-2">
                  <div class="h-4 bg-off-white/10 rounded w-36"></div>
                  <div class="h-3 bg-off-white/10 rounded w-16"></div>
                </div>
              </div>
              <div class="w-4 h-4 bg-off-white/10 rounded-full"></div>
            </div>
          </div>
        </main>

        <a
          href="new-athlete.html"
          class="absolute bottom-32 right-6 w-16 h-16 bg-primary text-off-white rounded-full shadow-lg shadow-primary/30 flex items-center justify-center active:scale-90 transition-transform z-30"
        >
          <span class="material-symbols-outlined text-4xl">person_add</span>
        </a>
      </div>
      <nav
        id="bottom-nav"
        class="bg-card-dark/90 ios-blur border-t border-subtle px-6 flex justify-around items-center z-40 shrink-0"
      >
        <a
          href="athletes.html"
          id="nav-athletes"
          class="flex flex-col items-center gap-1.5 text-primary flex-1 touch-target active:opacity-60"
        >
          <span
            class="material-symbols-outlined text-[30px]"
            style="font-variation-settings: 'FILL' 1"
            >groups</span
          >
          <span class="text-[11px] font-bold" data-i18n="athletes"></span>
        </a>
        <a
          href="calendar.html"
          id="nav-calendar"
          class="flex flex-col items-center gap-1.5 text-light-blue-info flex-1 touch-target active:opacity-60"
        >
          <span class="material-symbols-outlined text-[30px]">calendar_month</span>
          <span class="text-[11px] font-semibold" data-i18n="calendar_title"></span>
        </a>
        <a
          href="index.html"
          id="nav-sessions"
          class="flex flex-col items-center gap-1.5 text-light-blue-info flex-1 touch-target active:opacity-60"
        >
          <span class="material-symbols-outlined text-[30px]">event_note</span>
          <span class="text-[11px] font-semibold" data-i18n="sessions"></span>
        </a>
        <a
          href="analytics.html"
          id="nav-analytics"
          class="flex flex-col items-center gap-1.5 text-light-blue-info flex-1 touch-target active:opacity-60"
        >
          <span class="material-symbols-outlined text-[30px]">analytics</span>
          <span class="text-[11px] font-semibold" data-i18n="analytics"></span>
        </a>
        <a
          href="menu.html"
          id="nav-menu"
          class="flex flex-col items-center gap-1.5 text-light-blue-info flex-1 touch-target active:opacity-60"
        >
          <span class="material-symbols-outlined text-[30px]">more_horiz</span>
          <span class="text-[11px] font-semibold" data-i18n="more"></span>
        </a>
      </nav>
    </div>
    <script src="js/core/lang.js"></script>
    <script src="js/utils/utils.js"></script>
    <script src="js/pages/athletes.js"></script>
  </body>
</html>
