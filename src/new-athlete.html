<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Biathlon Shooting Assistant</title>
    <link rel="manifest" href="manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="assets/icons/app-icon.png" />

    <link rel="icon" href="assets/icons/app-icon.png" type="image/png" />

    <meta name="theme-color" content="#000000" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/global/global.css" />

    <link rel="stylesheet" href="css/pages/new-athlete.css" />

    <link rel="stylesheet" href="css/global/desktop.css" />
    <script src="js/core/config.js"></script>
    <script src="js/core/theme-manager.js"></script>
    <script src="js/services/api-service.js"></script>
    <script src="js/services/auth-guard.js"></script>
    <script src="js/utils/dynamic-selects.js"></script>
    <script src="js/core/tailwind-config.js"></script>
  </head>
  <body class="text-off-white min-h-screen flex justify-center items-start">
    <div
      id="app-container"
      class="w-full max-w-[430px] fixed inset-0 mx-auto md:relative md:inset-auto md:h-screen bg-deep-charcoal overflow-hidden flex flex-col shadow-2xl md:rounded-[55px] md:border-8 md:border-zinc-800"
    >
      <div id="desktop-main-content" class="flex flex-col flex-1 min-h-0">
        <div
          class="status-bar px-8 pt-1 pb-1 flex justify-between items-center text-base font-semibold text-off-white"
        ></div>
        <header class="px-6 pt-1 pb-4 border-b border-subtle">
          <div class="flex items-center gap-4">
            <a
              href="athletes.html"
              class="p-2 -ml-2 text-off-white/70 active:scale-90 transition-all"
            >
              <span class="material-symbols-outlined text-[28px]">arrow_back_ios_new</span>
            </a>
            <h1
              class="text-2xl font-bold tracking-tight text-off-white"
              data-i18n="new_athlete"
            ></h1>
          </div>
        </header>

        <main class="flex-1 overflow-y-auto px-6 py-4 space-y-5 no-scrollbar">
          <div class="bg-card-dark rounded-2xl p-5 border border-subtle space-y-4">
            <div class="space-y-4">
              <div class="relative">
                <input
                  class="w-full px-4 py-3.5 bg-off-white/5 border border-subtle rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none text-off-white placeholder-light-blue-info text-sm transition-all name-input"
                  data-i18n-placeholder="first_name"
                  type="text"
                  id="firstName"
                />
              </div>
              <div class="relative">
                <input
                  class="w-full px-4 py-3.5 bg-off-white/5 border border-subtle rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none text-off-white placeholder-light-blue-info text-sm transition-all name-input"
                  data-i18n-placeholder="last_name"
                  type="text"
                  id="lastName"
                />
              </div>
              <div
                id="duplicateNameError"
                class="hidden px-4 py-3 bg-red-500/10 border border-red-500/30 rounded-xl flex items-start gap-3"
              >
                <span
                  class="material-symbols-outlined text-red-500 text-[20px] flex-shrink-0 mt-0.5"
                  >error</span
                >
                <div class="flex-1">
                  <p class="text-red-500 text-sm font-medium" data-i18n="athlete_exists"></p>
                  <p
                    class="text-red-500/75 text-xs mt-1"
                    id="duplicateNameMessage"
                    data-i18n="athlete_name_exists"
                  ></p>
                </div>
              </div>
              <div class="flex gap-4">
                <div class="relative flex-1">
                  <input
                    class="w-full px-4 py-3.5 bg-off-white/5 border border-subtle rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none text-off-white placeholder-light-blue-info text-sm transition-all"
                    data-i18n-placeholder="date_of_birth"
                    type="date"
                    id="dateOfBirth"
                  />
                </div>
                <div class="relative w-[120px]">
                  <select
                    class="w-full px-4 py-3.5 bg-white/5 border border-subtle rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none appearance-none text-sm text-light-blue-info cursor-pointer"
                    id="gender"
                  >
                    <option value="m">m</option>
                    <option value="w">w</option>
                  </select>
                  <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                    <span class="material-symbols-outlined text-light-blue-info text-[20px]"
                      >expand_more</span
                    >
                  </div>
                </div>
              </div>
              <div class="relative">
                <input
                  class="w-full px-4 py-3.5 bg-off-white/5 border border-subtle rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none text-off-white placeholder-light-blue-info text-sm transition-all"
                  data-i18n-placeholder="age"
                  type="number"
                  id="age"
                  min="0"
                />
              </div>
              <div class="relative">
                <select
                  class="w-full px-4 py-3.5 bg-white/5 border border-subtle rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none appearance-none text-sm text-light-blue-info cursor-pointer"
                  id="ageGroup"
                >
                  <option disabled selected value="" data-i18n="age_group"></option>
                </select>
                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
                  <span class="material-symbols-outlined text-light-blue-info text-[20px]"
                    >expand_more</span
                  >
                </div>
              </div>
              <div class="relative">
                <select
                  class="w-full px-4 py-3.5 bg-white/5 border border-subtle rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none appearance-none text-sm text-light-blue-info cursor-pointer"
                  id="squad"
                >
                  <option disabled selected value="" data-i18n="squad_kader"></option>
                </select>
                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
                  <span class="material-symbols-outlined text-light-blue-info text-[20px]"
                    >expand_more</span
                  >
                </div>
              </div>
              <div class="relative">
                <select
                  class="w-full px-4 py-3.5 bg-white/5 border border-subtle rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none appearance-none text-sm text-light-blue-info cursor-pointer"
                  id="country"
                  onchange="onCountryChange()"
                >
                  <option disabled selected value="" data-i18n="country"></option>
                </select>
                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
                  <span class="material-symbols-outlined text-light-blue-info text-[20px]"
                    >expand_more</span
                  >
                </div>
              </div>
              <div class="relative hidden" id="federation-container">
                <select
                  class="w-full px-4 py-3.5 bg-white/5 border border-subtle rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none appearance-none text-sm text-light-blue-info cursor-pointer"
                  id="federation"
                >
                  <option disabled selected value="" data-i18n="federation"></option>
                </select>
                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
                  <span class="material-symbols-outlined text-light-blue-info text-[20px]"
                    >expand_more</span
                  >
                </div>
              </div>
            </div>
          </div>

          <div class="space-y-3">
            <h3
              class="text-sm font-bold uppercase tracking-widest text-light-blue-info px-1"
              data-i18n="shooting_preference"
            ></h3>
            <div class="bg-card-dark rounded-2xl p-5 border border-subtle space-y-4">
              <div class="flex items-center justify-between">
                <span class="text-sm font-semibold text-off-white" data-i18n="prone_start"></span>
                <div class="segmented-control">
                  <input class="hidden" id="p_left" name="prone_pref" type="radio" checked />
                  <label for="p_left" data-i18n="left"></label>
                  <input class="hidden" id="p_right" name="prone_pref" type="radio" />
                  <label for="p_right" data-i18n="right"></label>
                </div>
              </div>
              <div class="flex items-center justify-between">
                <span
                  class="text-sm font-semibold text-off-white"
                  data-i18n="standing_start"
                ></span>
                <div class="segmented-control">
                  <input class="hidden" id="s_left" name="standing_pref" type="radio" checked />
                  <label for="s_left" data-i18n="left"></label>
                  <input class="hidden" id="s_right" name="standing_pref" type="radio" />
                  <label for="s_right" data-i18n="right"></label>
                </div>
              </div>
              <div class="flex items-center justify-between pt-2 border-t border-subtle/30">
                <span class="text-sm font-semibold text-off-white" data-i18n="click_value"></span>
                <div class="flex items-center gap-2">
                  <input
                    type="number"
                    id="athlete-click-value"
                    class="w-20 bg-off-white/5 border border-subtle rounded-lg px-3 py-2 text-right text-off-white focus:outline-none focus:border-primary"
                    value="6.0"
                  />
                  <span class="text-xs text-light-blue-info" data-i18n="mm_short"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="space-y-3">
            <h3
              class="text-sm font-bold uppercase tracking-widest text-light-blue-info px-1"
              data-i18n="shooting_time_adjustments"
            ></h3>
            <div class="bg-card-dark rounded-2xl p-5 border border-subtle space-y-4">
              <div class="flex items-center justify-between">
                <span class="text-sm font-semibold text-off-white" data-i18n="use_defaults"></span>
                <div
                  class="w-11 h-6 bg-primary rounded-full relative cursor-pointer"
                  id="use-defaults-toggle"
                  onclick="toggleUseDefaults()"
                >
                  <div
                    class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-all"
                    id="use-defaults-knob"
                  ></div>
                </div>
              </div>
              <div
                id="custom-times-container"
                class="space-y-4 transition-opacity opacity-50 pointer-events-none"
              >
                <div class="flex items-center justify-between">
                  <span class="text-sm font-medium text-zinc-400" data-i18n="prone_plus_sec"></span>
                  <input
                    type="number"
                    id="athlete-prone-time"
                    class="w-20 bg-off-white/5 border border-subtle rounded-lg px-3 py-2 text-right text-off-white focus:outline-none focus:border-primary"
                    value="20"
                    disabled
                  />
                </div>
                <div class="flex items-center justify-between">
                  <span
                    class="text-sm font-medium text-zinc-400"
                    data-i18n="standing_plus_sec"
                  ></span>
                  <input
                    type="number"
                    id="athlete-standing-time"
                    class="w-20 bg-off-white/5 border border-subtle rounded-lg px-3 py-2 text-right text-off-white focus:outline-none focus:border-primary"
                    value="15"
                    disabled
                  />
                </div>
              </div>
            </div>
          </div>

          <div id="form-actions" class="py-6 flex gap-3">
            <button
              id="saveBtn"
              class="flex-[2] bg-primary active:scale-[0.96] active:opacity-80 text-white font-bold py-5 rounded-2xl shadow-lg transition-all text-base flex items-center justify-center"
            >
              <span id="saveBtnText" data-i18n="save_athlete"></span>
            </button>
          </div>

          <div
            id="successMessage"
            class="fixed top-0 left-0 right-0 flex justify-center pt-4 z-50 pointer-events-none"
          >
            <div
              class="bg-neon-green text-deep-charcoal px-6 py-3 rounded-full font-semibold text-sm shadow-lg opacity-0 transition-all duration-300 transform -translate-y-4"
              data-i18n="athlete_saved_success"
            ></div>
          </div>
        </main>

      </div>
    </div>
    <script src="js/core/lang.js"></script>
    <script src="js/utils/utils.js"></script>
    <script src="js/pages/new-athlete.js"></script>
    <script src="js/pages/inline-1/new-athlete-inline-1.js"></script>
  </body>
</html>
