<!doctype html>
<html class="dark" lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Biathlon Shooting Assistant</title>
    <link rel="manifest" href="manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="assets/icons/app-icon.png" />

    <link rel="icon" href="assets/icons/app-icon.png" type="image/png" />

    <meta name="theme-color" content="#000000" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <script src="js/core/theme-manager.js"></script>
    <script src="js/services/api-service.js"></script>
    <script src="js/services/auth-guard.js"></script>
    <script src="js/core/lang.js"></script>
    <script src="js/core/constants.js"></script>
    <script src="js/utils/utils.js"></script>
    <script src="js/pages/analytics-settings.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/global/global.css" />

    <link rel="stylesheet" href="css/global/desktop.css" />

    <script src="js/core/tailwind-config.js"></script>

    <link rel="stylesheet" href="css/pages/analytics-settings-inline.css" />
  </head>
  <body class="text-off-white min-h-screen flex justify-center items-start">
    <div
      id="app-container"
      class="w-full max-w-[430px] fixed inset-0 mx-auto md:relative md:inset-auto md:h-screen bg-deep-charcoal overflow-hidden flex flex-col shadow-2xl md:rounded-[55px] md:border-[8px] md:border-zinc-800"
    >
      <div id="desktop-main-content" class="flex flex-col flex-1 min-h-0">
        <header class="px-6 pt-2 pb-3 border-b border-subtle/40 shrink-0">
          <div class="flex items-center gap-4">
            <button
              type="button"
              onclick="navigateBack()"
              class="p-2 -ml-2 text-off-white/70 active:scale-90 transition-all"
            >
              <span class="material-symbols-outlined text-[28px]">arrow_back_ios_new</span>
            </button>
            <div>
              <h1
                class="text-3xl font-bold tracking-tight text-off-white"
                data-i18n="analytics_settings"
              ></h1>
            </div>
          </div>
        </header>

        <main class="flex-1 overflow-y-auto px-6 py-6 no-scrollbar space-y-4">
          <div
            class="bg-card-dark rounded-3xl w-full border border-subtle overflow-hidden divide-y divide-subtle/40"
          >
            <div
              class="p-5 flex items-center justify-between cursor-pointer active:bg-off-white/5 transition-colors select-none"
              onclick="toggleAnalysisSetting('heatmap')"
            >
              <div class="flex items-center gap-3">
                <span class="text-off-white font-medium text-base" data-i18n="show_heatmap"></span>
              </div>
              <div
                id="check-analysis-heatmap"
                class="w-6 h-6 rounded-full shrink-0 flex items-center justify-center transition-all bg-primary text-white shadow-sm"
              >
                <span class="material-symbols-outlined text-sm font-bold">check</span>
              </div>
            </div>

            <div
              class="p-5 flex items-center justify-between cursor-pointer active:bg-off-white/5 transition-colors select-none"
              onclick="toggleAnalysisSetting('combined')"
            >
              <div class="flex items-center gap-3">
                <span class="text-off-white font-medium text-base" data-i18n="show_combined"></span>
              </div>
              <div
                id="check-analysis-combined"
                class="w-6 h-6 rounded-full shrink-0 flex items-center justify-center transition-all bg-primary text-white shadow-sm"
              >
                <span class="material-symbols-outlined text-sm font-bold">check</span>
              </div>
            </div>

            <div
              class="p-5 flex items-center justify-between cursor-pointer active:bg-off-white/5 transition-colors select-none"
              onclick="toggleAnalysisSetting('trend')"
            >
              <div class="flex items-center gap-3">
                <span class="text-off-white font-medium text-base" data-i18n="show_trend"></span>
              </div>
              <div
                id="check-analysis-trend"
                class="w-6 h-6 rounded-full shrink-0 flex items-center justify-center transition-all bg-primary text-white shadow-sm"
              >
                <span class="material-symbols-outlined text-sm font-bold">check</span>
              </div>
            </div>

            <div
              class="p-5 flex items-center justify-between cursor-pointer active:bg-off-white/5 transition-colors select-none"
              onclick="toggleAnalysisSetting('mean-shot')"
            >
              <div class="flex items-center gap-3">
                <span
                  class="text-off-white font-medium text-base"
                  data-i18n="show_mean_shot"
                ></span>
              </div>
              <div
                id="check-analysis-mean-shot"
                class="w-6 h-6 rounded-full shrink-0 flex items-center justify-center transition-all bg-primary text-white shadow-sm"
              >
                <span class="material-symbols-outlined text-sm font-bold">check</span>
              </div>
            </div>

            <div
              class="p-5 flex items-center justify-between cursor-pointer active:bg-off-white/5 transition-colors select-none"
              onclick="toggleAnalysisSetting('direction')"
            >
              <div class="flex items-center gap-3">
                <span
                  class="text-off-white font-medium text-base"
                  data-i18n="show_direction"
                ></span>
              </div>
              <div
                id="check-analysis-direction"
                class="w-6 h-6 rounded-full shrink-0 flex items-center justify-center transition-all bg-primary text-white shadow-sm"
              >
                <span class="material-symbols-outlined text-sm font-bold">check</span>
              </div>
            </div>
          </div>
        </main>

      </div>
    </div>
  </body>
</html>
