<!doctype html>
<html class="dark" lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Biathlon Shooting Assistant</title>
    <link rel="manifest" href="manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="assets/icons/app-icon.png" />

    <link rel="icon" href="assets/icons/app-icon.png" type="image/png" />

    <meta name="theme-color" content="#000000" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <script src="js/core/theme-manager.js"></script>
    <script src="js/services/api-service.js"></script>
    <script src="js/services/auth-guard.js"></script>
    <script src="js/core/lang.js"></script>
    <script src="js/core/constants.js"></script>
    <script src="js/utils/utils.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/global/global.css" />

    <link rel="stylesheet" href="css/global/desktop.css" />

    <script src="js/core/tailwind-config.js"></script>

    <link rel="stylesheet" href="css/pages/athletes-settings-inline.css" />
  </head>
  <body class="text-off-white min-h-screen flex justify-center items-start">
    <div
      id="app-container"
      class="w-full max-w-[430px] fixed inset-0 mx-auto md:relative md:inset-auto md:h-screen bg-deep-charcoal overflow-hidden flex flex-col shadow-2xl md:rounded-[55px] md:border-[8px] md:border-zinc-800"
    >
      <div id="desktop-main-content" class="flex flex-col flex-1 min-h-0">
        <header class="px-6 pt-2 pb-3 border-b border-subtle/40 shrink-0">
          <div class="flex items-center gap-4">
            <button
              type="button"
              onclick="navigateBack()"
              class="p-2 -ml-2 text-off-white/70 active:scale-90 transition-all"
            >
              <span class="material-symbols-outlined text-[28px]">arrow_back_ios_new</span>
            </button>
            <div>
              <h1
                class="text-3xl font-bold tracking-tight text-off-white"
                data-i18n="athlete_management"
              ></h1>
            </div>
          </div>
        </header>

        <main class="flex-1 overflow-y-auto px-6 py-6 no-scrollbar">
          <section class="space-y-4">
            <div
              class="bg-card-dark rounded-3xl p-6 w-full border border-subtle flex flex-col gap-4"
            >
              <div class="flex items-center justify-between">
                <div>
                  <h3 class="text-xl font-bold text-off-white" data-i18n="athlete_management"></h3>
                </div>
              </div>

              <button
                type="button"
                onclick="openModal('age')"
                class="w-full p-4 bg-off-white/5 border border-subtle rounded-2xl flex items-center justify-between text-left hover:bg-off-white/10 transition-colors"
              >
                <div>
                  <p class="text-sm text-light-blue-info" data-i18n="manage_age_groups"></p>
                  <p id="age-summary" class="text-off-white font-semibold mt-1"></p>
                </div>
                <span class="material-symbols-outlined text-zinc-600">chevron_right</span>
              </button>

              <button
                type="button"
                onclick="openModal('kader')"
                class="w-full p-4 bg-off-white/5 border border-subtle rounded-2xl flex items-center justify-between text-left hover:bg-off-white/10 transition-colors"
              >
                <div>
                  <p class="text-sm text-light-blue-info" data-i18n="manage_kader"></p>
                  <p id="kader-summary" class="text-off-white font-semibold mt-1"></p>
                </div>
                <span class="material-symbols-outlined text-zinc-600">chevron_right</span>
              </button>

              <button
                type="button"
                onclick="openModal('country')"
                class="w-full p-4 bg-off-white/5 border border-subtle rounded-2xl flex items-center justify-between text-left hover:bg-off-white/10 transition-colors"
              >
                <div>
                  <p class="text-sm text-light-blue-info" data-i18n="manage_country"></p>
                  <p id="country-summary" class="text-off-white font-semibold mt-1"></p>
                </div>
                <span class="material-symbols-outlined text-zinc-600">chevron_right</span>
              </button>

              <button
                type="button"
                onclick="openModal('fed')"
                class="w-full p-4 bg-off-white/5 border border-subtle rounded-2xl flex items-center justify-between text-left hover:bg-off-white/10 transition-colors"
              >
                <div>
                  <p class="text-sm text-light-blue-info" data-i18n="manage_federation"></p>
                  <p id="fed-summary" class="text-off-white font-semibold mt-1"></p>
                </div>
                <span class="material-symbols-outlined text-zinc-600">chevron_right</span>
              </button>
            </div>
          </section>

        </main>

        <div
          id="modal-age"
          class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center px-6"
          onclick="closeModal('age', event)"
        >
          <div
            class="bg-card-dark rounded-3xl p-6 max-w-sm w-full border border-subtle flex flex-col h-[75vh] max-h-[85vh]"
            onclick="event.stopPropagation()"
          >
            <div class="flex items-center justify-between gap-3 mb-4 shrink-0">
              <button
                type="button"
                onclick="closeModal('age')"
                class="flex items-center gap-2 rounded-lg bg-off-white/5 px-3 py-2 text-off-white hover:bg-off-white/10 transition-colors"
              >
                <span class="material-symbols-outlined text-xl">arrow_back_ios_new</span>
              </button>
              <h3
                class="text-xl font-bold text-off-white flex-1 text-center"
                data-i18n="manage_age_groups"
              ></h3>
              <div class="w-10"></div>
            </div>
            <div class="flex-grow overflow-y-auto min-h-[80px] pr-1">
              <div id="age-chips" class="flex flex-wrap gap-3"></div>
            </div>
            <div class="pt-4 border-t border-subtle/30 mt-4 flex items-center gap-2 shrink-0">
              <input
                type="text"
                id="new-age-input"
                class="flex-1 px-4 py-3 bg-off-white/5 border border-subtle rounded-2xl text-off-white placeholder:text-zinc-500 focus:outline-none focus:border-primary text-sm transition-all"
                placeholder="Neue Altersklasse..."
                onkeydown="if (event.key === 'Enter') addAgeGroup();"
              />
              <button
                type="button"
                onclick="addAgeGroup()"
                class="p-3 bg-primary text-white rounded-2xl hover:bg-primary/90 active:scale-95 transition-all flex items-center justify-center shrink-0 shadow-lg glow-blue"
              >
                <span class="material-symbols-outlined text-xl">add</span>
              </button>
            </div>
          </div>
        </div>

        <div
          id="modal-kader"
          class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center px-6"
          onclick="closeModal('kader', event)"
        >
          <div
            class="bg-card-dark rounded-3xl p-6 max-w-sm w-full border border-subtle flex flex-col h-[75vh] max-h-[85vh]"
            onclick="event.stopPropagation()"
          >
            <div class="flex items-center justify-between gap-3 mb-4 shrink-0">
              <button
                type="button"
                onclick="closeModal('kader')"
                class="flex items-center gap-2 rounded-lg bg-off-white/5 px-3 py-2 text-off-white hover:bg-off-white/10 transition-colors"
              >
                <span class="material-symbols-outlined text-xl">arrow_back_ios_new</span>
              </button>
              <h3
                class="text-xl font-bold text-off-white flex-1 text-center"
                data-i18n="manage_kader"
              ></h3>
              <div class="w-10"></div>
            </div>
            <div class="flex-grow overflow-y-auto min-h-[80px] pr-1">
              <div id="kader-chips" class="flex flex-wrap gap-3"></div>
            </div>
            <div class="pt-4 border-t border-subtle/30 mt-4 flex items-center gap-2 shrink-0">
              <input
                type="text"
                id="new-kader-input"
                class="flex-1 px-4 py-3 bg-off-white/5 border border-subtle rounded-2xl text-off-white placeholder:text-zinc-500 focus:outline-none focus:border-primary text-sm transition-all"
                placeholder="Neuer Kader..."
                onkeydown="if (event.key === 'Enter') addKader();"
              />
              <button
                type="button"
                onclick="addKader()"
                class="p-3 bg-primary text-white rounded-2xl hover:bg-primary/90 active:scale-95 transition-all flex items-center justify-center shrink-0 shadow-lg glow-blue"
              >
                <span class="material-symbols-outlined text-xl">add</span>
              </button>
            </div>
          </div>
        </div>

        <div
          id="modal-country"
          class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center px-6"
          onclick="closeModal('country', event)"
        >
          <div
            class="bg-card-dark rounded-3xl p-6 max-w-sm w-full border border-subtle flex flex-col h-[75vh] max-h-[85vh]"
            onclick="event.stopPropagation()"
          >
            <div class="flex items-center justify-between gap-3 mb-4 shrink-0">
              <button
                type="button"
                onclick="closeModal('country')"
                class="flex items-center gap-2 rounded-lg bg-off-white/5 px-3 py-2 text-off-white hover:bg-off-white/10 transition-colors"
              >
                <span class="material-symbols-outlined text-xl">arrow_back_ios_new</span>
              </button>
              <h3
                class="text-xl font-bold text-off-white flex-1 text-center"
                data-i18n="manage_country"
              ></h3>
              <div class="w-10"></div>
            </div>
            <div class="flex-grow overflow-y-auto min-h-[80px] pr-1">
              <div id="country-chips" class="chips-scroll"></div>
            </div>
            <div class="pt-4 border-t border-subtle/30 mt-4 flex items-center gap-2 shrink-0">
              <input
                type="text"
                id="new-country-input"
                class="flex-1 px-4 py-3 bg-off-white/5 border border-subtle rounded-2xl text-off-white placeholder:text-zinc-500 focus:outline-none focus:border-primary text-sm transition-all"
                placeholder="Neues Land..."
                onkeydown="if (event.key === 'Enter') addCountry();"
              />
              <button
                type="button"
                onclick="addCountry()"
                class="p-3 bg-primary text-white rounded-2xl hover:bg-primary/90 active:scale-95 transition-all flex items-center justify-center shrink-0 shadow-lg glow-blue"
              >
                <span class="material-symbols-outlined text-xl">add</span>
              </button>
            </div>
          </div>
        </div>

        <div
          id="modal-fed"
          class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center px-6"
          onclick="closeModal('fed', event)"
        >
          <div
            class="bg-card-dark rounded-3xl p-6 max-w-sm w-full border border-subtle flex flex-col h-[75vh] max-h-[85vh]"
            onclick="event.stopPropagation()"
          >
            <div class="flex items-center justify-between gap-3 mb-4 shrink-0">
              <button
                type="button"
                onclick="closeModal('fed')"
                class="flex items-center gap-2 rounded-lg bg-off-white/5 px-3 py-2 text-off-white hover:bg-off-white/10 transition-colors"
              >
                <span class="material-symbols-outlined text-xl">arrow_back_ios_new</span>
              </button>
              <h3
                class="text-xl font-bold text-off-white flex-1 text-center"
                data-i18n="manage_federation"
              ></h3>
              <div class="w-10"></div>
            </div>
            <div class="flex-grow overflow-y-auto min-h-[80px] pr-1">
              <div id="fed-chips" class="flex flex-wrap gap-3"></div>
            </div>
            <div class="pt-4 border-t border-subtle/30 mt-4 flex items-center gap-2 shrink-0">
              <input
                type="text"
                id="new-fed-input"
                class="flex-1 px-4 py-3 bg-off-white/5 border border-subtle rounded-2xl text-off-white placeholder:text-zinc-500 focus:outline-none focus:border-primary text-sm transition-all"
                placeholder="Neuer Skiverband..."
                onkeydown="if (event.key === 'Enter') addFederation();"
              />
              <button
                type="button"
                onclick="addFederation()"
                class="p-3 bg-primary text-white rounded-2xl hover:bg-primary/90 active:scale-95 transition-all flex items-center justify-center shrink-0 shadow-lg glow-blue"
              >
                <span class="material-symbols-outlined text-xl">add</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/pages/settings.js"></script>
  </body>
</html>
