<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Biathlon Shooting Assistant</title>
    <link rel="manifest" href="manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="assets/icons/app-icon.png" />

    <link rel="icon" href="assets/icons/app-icon.png" type="image/png" />

    <meta name="theme-color" content="#000000" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <script src="js/core/theme-manager.js"></script>
    <script src="js/services/api-service.js"></script>
    <script src="js/services/auth-guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.28/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/global/global.css" />

    <link rel="stylesheet" href="css/global/desktop.css" />

    <script src="js/core/tailwind-config.js"></script>

    <link rel="stylesheet" href="css/pages/analytics-inline.css" />
  </head>
  <body class="text-off-white min-h-screen flex justify-center items-start transition-colors">
    <div
      id="app-container"
      class="w-full max-w-[430px] fixed inset-0 mx-auto md:relative md:inset-auto md:h-screen bg-deep-charcoal overflow-hidden flex flex-col shadow-2xl md:rounded-[55px] md:border-[8px] md:border-zinc-800"
    >
      <div id="desktop-main-content" class="flex flex-col flex-1 min-h-0">
        <div
          class="status-bar px-8 pt-1 pb-1 flex justify-between items-center text-base font-semibold text-off-white"
        ></div>
        <header class="px-6 pt-1">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-4">
              <button
                id="analytics-back"
                class="hidden p-2 -ml-2 text-off-white/70 active:scale-90 transition-all flex items-center justify-center"
              >
                <span class="material-symbols-outlined text-[28px]">arrow_back_ios_new</span>
              </button>
              <div class="space-y-1">
                <h1
                  id="analytics-title"
                  class="text-3xl font-bold tracking-tight text-off-white"
                  data-i18n="analytics"
                ></h1>
                <p
                  id="analytics-subtitle"
                  class="text-sm text-light-blue-info font-medium line-clamp-1"
                  data-i18n="performance_insights"
                ></p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button
                id="analytics-shot-opacity-btn"
                onclick="Analytics.toggleMiniTargetOpacity()"
                class="hidden w-11 h-11 flex items-center justify-center rounded-full bg-card-dark border border-subtle text-off-white/70 active:scale-95 transition-transform"
                title="Schuss-Transparenz"
              >
                <span class="material-symbols-outlined text-[24px]">blur_on</span>
              </button>
              <button
                id="analytics-filter-btn"
                onclick="Analytics.toggleFilters()"
                class="w-11 h-11 flex items-center justify-center rounded-full bg-card-dark border border-subtle text-off-white/70 active:scale-95 transition-transform"
                title="Filtern"
              >
                <span class="material-symbols-outlined text-[28px]">filter_alt</span>
              </button>
              <button
                id="analytics-add-btn"
                onclick="Analytics.openAnalysisBuilder()"
                class="w-11 h-11 flex items-center justify-center rounded-full bg-card-dark border border-subtle text-off-white/70 active:scale-95 transition-transform"
                title="Eigene Analyse erstellen"
              >
                <span class="material-symbols-outlined text-[28px]">add_chart</span>
              </button>
              <a
                id="analytics-export-link"
                href="export.html?from=analytics"
                class="w-11 h-11 flex items-center justify-center rounded-full bg-card-dark border border-subtle text-off-white/70 active:scale-95 transition-transform"
              >
                <span class="material-symbols-outlined text-[28px]">download</span>
              </a>
              <button
                id="analytics-edit-toggle-btn"
                class="w-11 h-11 flex items-center justify-center rounded-full bg-card-dark border border-subtle text-off-white/70 active:scale-95 transition-transform"
                data-i18n="edit"
                title="Analysen bearbeiten"
              >
                <span class="material-symbols-outlined text-[24px]">edit</span>
              </button>
            </div>
          </div>

          <div
            id="overview-filters-container"
            class="hidden flex flex-col gap-2 pb-4 pt-1 px-1 overflow-visible border-b border-subtle/30 mb-2"
          ></div>
        </header>

        <main class="flex-1 overflow-y-auto px-6 py-4 space-y-4 no-scrollbar">
          <section id="section-custom-container" class="space-y-2">
            <div
              class="sticky top-0 z-[11] bg-navy-charcoal/95 backdrop-blur-md border border-primary/20 rounded-2xl p-3.5 px-4 flex justify-between items-center transition-all shadow-xl -mx-1"
            >
              <div
                class="flex items-center gap-2.5 cursor-pointer flex-1 min-w-0"
                onclick="toggleCustomAnalysis()"
              >
                <span class="text-primary font-bold truncate" data-i18n="custom_analyses"
                  >Eigene Analysen</span
                >
                <span
                  id="custom-analysis-count"
                  class="text-xs bg-primary/20 text-primary px-2 py-0.5 rounded-full font-bold"
                  >0</span
                >
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <button
                  type="button"
                  onclick="
                    event.stopPropagation();
                    Analytics.openAnalysisBuilder();
                  "
                  class="flex items-center gap-1 text-xs font-semibold bg-primary/20 text-primary border border-primary/30 px-3 py-1 rounded-xl hover:bg-primary hover:text-white transition-all active:scale-95"
                  title="Neue Analyse erstellen"
                >
                  <span class="material-symbols-outlined text-sm">add</span>
                  <span data-i18n="add_analysis">Erstellen</span>
                </button>
                <span
                  id="custom-analysis-chevron"
                  onclick="toggleCustomAnalysis()"
                  class="material-symbols-outlined text-primary cursor-pointer transition-transform duration-200 p-1"
                  style="transform: rotate(0deg)"
                  >expand_more</span
                >
              </div>
            </div>
            <div id="custom-analysis-content" class="space-y-4 pt-2 hidden">
              <div
                id="custom-analytics-container"
                class="grid grid-cols-1 md:grid-cols-2 gap-4 pb-10"
              ></div>
            </div>
          </section>

          <section id="section-analysis-container" class="space-y-2">
            <div id="analysis-content" class="space-y-4 pt-2">
              <div
                id="analysis-layout-tools"
                class="hidden items-center justify-between bg-card-dark/70 border border-subtle rounded-2xl px-4 py-2.5"
              >
                <span
                  class="text-[11px] font-bold text-light-blue-info/80 uppercase tracking-wider"
                  data-i18n="edit_layout"
                ></span>
                <button
                  id="analysis-edit-restore-btn"
                  class="px-3 py-1.5 rounded-full border border-subtle text-xs font-semibold text-off-white/80 bg-card-dark hover:bg-off-white/5 transition-colors"
                  data-i18n="restore_hidden"
                ></button>
              </div>
              <div
                id="section-stats"
                data-overview-analysis-id="stats"
                class="grid grid-cols-2 gap-3"
              >
                <div
                  onclick="Analytics.showStandardAnalysisDetail('series')"
                  class="bg-card-dark p-4 rounded-2xl border border-subtle flex flex-col items-center justify-center shadow-sm cursor-pointer active:scale-95 transition-all"
                >
                  <div class="text-2xl font-black text-off-white" id="stat-total-series">0</div>
                  <div
                    class="text-[10px] uppercase font-bold text-zinc-500 tracking-wider mt-1"
                    data-i18n="series"
                  ></div>
                </div>
                <div
                  onclick="Analytics.showStandardAnalysisDetail('hit_rate')"
                  class="bg-card-dark p-4 rounded-2xl border border-subtle flex flex-col items-center justify-center shadow-sm cursor-pointer active:scale-95 transition-all"
                >
                  <div class="text-2xl font-black text-neon-green" id="stat-hit-rate">0%</div>
                  <div
                    class="text-[10px] uppercase font-bold text-zinc-500 tracking-wider mt-1"
                    data-i18n="hit_rate"
                  ></div>
                </div>
                <div
                  onclick="Analytics.showStandardAnalysisDetail('avg_rings')"
                  class="bg-card-dark p-4 rounded-2xl border border-subtle flex flex-col items-center justify-center shadow-sm cursor-pointer active:scale-95 transition-all"
                >
                  <div class="text-2xl font-black text-yellow-400" id="stat-avg-rings">0.0</div>
                  <div
                    class="text-[10px] uppercase font-bold text-zinc-500 tracking-wider mt-1"
                    data-i18n="avg_rings"
                  ></div>
                </div>
                <div
                  onclick="Analytics.showStandardAnalysisDetail('shots')"
                  class="bg-card-dark p-4 rounded-2xl border border-subtle flex flex-col items-center justify-center shadow-sm cursor-pointer active:scale-95 transition-all"
                >
                  <div class="text-2xl font-black text-primary" id="stat-total-shots">0</div>
                  <div
                    class="text-[10px] uppercase font-bold text-zinc-500 tracking-wider mt-1"
                    data-i18n="shots_count"
                  ></div>
                </div>
              </div>
              <div
                id="section-heatmap"
                data-overview-analysis-id="heatmap"
                class="bg-card-dark rounded-2xl border border-subtle overflow-hidden shadow-lg"
              >
                <div
                  onclick="Analytics.showStandardAnalysisDetail('heatmap')"
                  class="px-4 py-3 border-b border-subtle bg-off-white/5 flex justify-between items-center cursor-pointer hover:bg-white/5 transition-colors"
                >
                  <span
                    class="text-xs font-bold text-zinc-400 uppercase tracking-widest"
                    data-i18n="shot_distribution"
                  ></span>
                </div>
                <div class="p-6 flex justify-center">
                  <div
                    id="heatmap-container"
                    onclick="Analytics.showStandardAnalysisDetail('heatmap')"
                    class="w-64 h-64 relative cursor-pointer active:scale-95 transition-transform hover:opacity-90"
                  ></div>
                </div>
              </div>
              <div
                id="section-combined"
                data-overview-analysis-id="combined"
                class="bg-card-dark rounded-2xl border border-subtle overflow-hidden shadow-lg"
              >
                <div
                  onclick="Analytics.showStandardAnalysisDetail('combined')"
                  class="px-4 py-3 border-b border-subtle bg-off-white/5 flex justify-between items-center cursor-pointer hover:bg-white/5 transition-colors"
                >
                  <span
                    class="text-xs font-bold text-zinc-400 uppercase tracking-widest"
                    data-i18n="combined_accuracy"
                  ></span>
                </div>
                <div class="p-6 flex justify-center">
                  <div
                    id="total-placements-container"
                    onclick="Analytics.showStandardAnalysisDetail('combined')"
                    class="w-64 h-64 relative cursor-pointer active:scale-95 transition-transform hover:opacity-90"
                  ></div>
                </div>
              </div>
              <div
                id="section-trend"
                data-overview-analysis-id="trend"
                class="bg-card-dark rounded-2xl border border-subtle overflow-hidden shadow-lg"
              >
                <div
                  onclick="Analytics.showStandardAnalysisDetail('trend')"
                  class="px-4 py-3 border-b border-subtle bg-off-white/5 flex justify-between items-center cursor-pointer hover:bg-white/5 transition-colors"
                >
                  <span
                    class="text-xs font-bold text-zinc-400 uppercase tracking-widest"
                    data-i18n="performance_trend"
                  ></span>
                </div>
                <div class="p-4 flex justify-center">
                  <div
                    id="trend-chart-container"
                    onclick="Analytics.showStandardAnalysisDetail('trend')"
                    class="w-full h-48 relative cursor-pointer active:scale-95 transition-transform hover:opacity-90"
                  ></div>
                </div>
              </div>
              <div
                id="section-mean-shot"
                data-overview-analysis-id="mean_shot"
                class="bg-card-dark rounded-2xl border border-subtle overflow-hidden shadow-lg"
              >
                <div
                  onclick="Analytics.showStandardAnalysisDetail('mean_shot')"
                  class="px-4 py-3 border-b border-subtle bg-off-white/5 flex justify-between items-center cursor-pointer hover:bg-white/5 transition-colors"
                >
                  <div class="flex items-center gap-2">
                    <span
                      class="text-xs font-bold text-zinc-400 uppercase tracking-widest"
                      data-i18n="avg_shot"
                    ></span>
                  </div>
                </div>
                <div class="p-6 flex justify-center">
                  <div
                    id="mean-shot-container"
                    onclick="Analytics.showStandardAnalysisDetail('mean_shot')"
                    class="w-full flex flex-col items-center cursor-pointer active:scale-95 transition-transform hover:opacity-90"
                  ></div>
                </div>
              </div>
              <div
                id="section-direction"
                data-overview-analysis-id="direction"
                class="bg-card-dark rounded-2xl border border-subtle overflow-hidden shadow-lg"
              >
                <div
                  onclick="Analytics.showStandardAnalysisDetail('direction')"
                  class="px-4 py-3 border-b border-subtle bg-off-white/5 flex justify-between items-center cursor-pointer hover:bg-white/5 transition-colors"
                >
                  <div class="flex items-center gap-2">
                    <span
                      class="text-xs font-bold text-zinc-400 uppercase tracking-widest"
                      data-i18n="avg_miss"
                    ></span>
                  </div>
                </div>
                <div class="p-4">
                  <div
                    id="dir-tendency-container"
                    onclick="Analytics.showStandardAnalysisDetail('direction')"
                    class="cursor-pointer active:scale-[0.98] transition-transform"
                  >
                    <div
                      class="text-center text-zinc-500 text-xs italic py-4"
                      data-i18n="no_data"
                    ></div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <div id="analytics-content" class="pb-10"></div>
        </main>

        <div
          id="analysis-builder-modal"
          class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-end sm:items-center justify-center p-0 sm:p-6 transition-all duration-300"
        >
          <div
            class="bg-card-dark w-full max-w-lg rounded-t-[32px] sm:rounded-[32px] border-t sm:border border-subtle overflow-hidden shadow-2xl flex flex-col max-h-[90vh] animate-in slide-in-from-bottom duration-300"
          >
            <div
              class="px-6 py-5 border-b border-subtle flex justify-between items-center bg-off-white/5"
            >
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 rounded-2xl bg-primary/20 text-primary flex items-center justify-center"
                >
                  <span class="material-symbols-outlined">add_chart</span>
                </div>
                <div>
                  <h3
                    class="text-lg font-bold text-off-white"
                    data-i18n="create_custom_metric"
                  ></h3>
                </div>
              </div>
              <button
                onclick="Analytics.closeAnalysisBuilder()"
                class="w-10 h-10 flex items-center justify-center rounded-full bg-black/5 dark:bg-white/5 text-zinc-500 hover:text-off-white transition-colors"
              >
                <span class="material-symbols-outlined">close</span>
              </button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 pb-32 space-y-5 no-scrollbar">
              <div class="space-y-2">
                <label
                  class="flex items-center gap-2 text-[11px] font-black text-zinc-500 uppercase tracking-widest pl-1"
                >
                  <span data-i18n="metric_name"></span>
                </label>
                <input
                  id="builder-metric-name"
                  type="text"
                  data-i18n-placeholder="metric_name_placeholder"
                  class="w-full h-14 px-5 bg-card-dark border border-subtle rounded-2xl text-off-white text-base font-medium focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all placeholder:text-zinc-500"
                />
              </div>
              <div class="space-y-2 relative z-50">
                <label
                  class="flex items-center gap-2 text-[11px] font-black text-zinc-500 uppercase tracking-widest pl-1"
                >
                  <span data-i18n="select_metric"></span>
                </label>
                <div class="relative">
                  <button
                    id="builder-metric-type-trigger"
                    type="button"
                    onclick="Analytics.toggleDropdown('metric-type')"
                    class="w-full h-14 px-5 bg-card-dark border border-subtle rounded-2xl flex items-center justify-between group hover:border-primary/50 transition-all"
                  >
                    <div class="flex items-center gap-3">
                      <span
                        id="trigger-metric-text"
                        class="text-off-white font-bold text-sm"
                      ></span>
                    </div>
                    <span
                      class="material-symbols-outlined text-zinc-600 group-hover:text-primary transition-colors"
                      >expand_more</span
                    >
                  </button>
                  <div
                    id="dropdown-metric-type"
                    class="hidden absolute top-full left-0 right-0 mt-2 bg-card-dark border border-subtle rounded-[24px] shadow-2xl z-50 overflow-hidden animate-in fade-in slide-in-from-top-2 duration-200"
                  >
                    <div class="p-2 space-y-1">
                      <button
                        class="w-full p-4 flex items-center gap-4 hover:bg-white/5 rounded-xl transition-all"
                        onclick="Analytics.setMetricType('hit_rate')"
                      >
                        <div class="text-left">
                          <p
                            class="text-sm font-bold text-off-white"
                            data-i18n="metric_hit_rate"
                          ></p>
                        </div>
                      </button>
                      <button
                        class="w-full p-4 flex items-center gap-4 hover:bg-white/5 rounded-xl transition-all"
                        onclick="Analytics.setMetricType('avg_ring')"
                      >
                        <div class="text-left">
                          <p
                            class="text-sm font-bold text-off-white"
                            data-i18n="metric_avg_ring"
                          ></p>
                        </div>
                      </button>
                      <button
                        class="w-full p-4 flex items-center gap-4 hover:bg-white/5 rounded-xl transition-all"
                        onclick="Analytics.setMetricType('group_size')"
                      >
                        <div class="text-left">
                          <p
                            class="text-sm font-bold text-off-white"
                            data-i18n="metric_group_size"
                          ></p>
                        </div>
                      </button>
                      <button
                        class="w-full p-4 flex items-center gap-4 hover:bg-white/5 rounded-xl transition-all"
                        onclick="Analytics.setMetricType('first_shot')"
                      >
                        <div class="text-left">
                          <p
                            class="text-sm font-bold text-off-white"
                            data-i18n="metric_first_shot"
                          ></p>
                        </div>
                      </button>
                      <button
                        class="w-full p-4 flex items-center gap-4 hover:bg-white/5 rounded-xl transition-all"
                        onclick="Analytics.setMetricType('avg_rhythm')"
                      >
                        <div class="text-left">
                          <p
                            class="text-sm font-bold text-off-white"
                            data-i18n="metric_avg_rhythm"
                          ></p>
                        </div>
                      </button>
                      <button
                        class="w-full p-4 flex items-center gap-4 hover:bg-white/5 rounded-xl transition-all"
                        onclick="Analytics.setMetricType('total_time')"
                      >
                        <div class="text-left">
                          <p
                            class="text-sm font-bold text-off-white"
                            data-i18n="metric_total_series_time"
                          ></p>
                        </div>
                      </button>
                      <button
                        class="w-full p-4 flex items-center gap-4 hover:bg-white/5 rounded-xl transition-all"
                        onclick="Analytics.setMetricType('avg_offset')"
                      >
                        <div class="text-left">
                          <p
                            class="text-sm font-bold text-off-white"
                            data-i18n="metric_avg_offset"
                          ></p>
                        </div>
                      </button>
                    </div>
                  </div>
                </div>
                <select id="builder-metric-type" class="hidden">
                  <option value="hit_rate">hit_rate</option>
                  <option value="avg_ring">avg_ring</option>
                  <option value="group_size">group_size</option>
                  <option value="first_shot">first_shot</option>
                  <option value="avg_rhythm">avg_rhythm</option>
                  <option value="total_time">total_time</option>
                  <option value="avg_offset">avg_offset</option>
                </select>
              </div>
              <div class="space-y-2">
                <label
                  class="flex items-center gap-2 text-[11px] font-black text-zinc-500 uppercase tracking-widest pl-1"
                >
                  <span data-i18n="focus_shots"></span>
                </label>
                <div class="flex flex-wrap gap-2" id="builder-focus-btn-group">
                  <button
                    data-value="all"
                    class="focus-btn px-4 h-12 rounded-xl bg-card-dark border border-subtle text-xs font-bold text-off-white/70 transition-all hover:bg-off-white/10 active:scale-95 flex items-center justify-center min-w-[60px]"
                    onclick="Analytics.setFocus('all')"
                  >
                    <span data-i18n="filter_all"></span>
                  </button>
                  <div class="flex gap-1.5 p-1 bg-off-white/5 rounded-2xl border border-subtle/50">
                    <button
                      data-value="1"
                      class="focus-btn w-10 h-10 rounded-xl text-xs font-black transition-all flex items-center justify-center"
                      onclick="Analytics.setFocus('1')"
                    >
                      1
                    </button>
                    <button
                      data-value="2"
                      class="focus-btn w-10 h-10 rounded-xl text-xs font-black transition-all flex items-center justify-center"
                      onclick="Analytics.setFocus('2')"
                    >
                      2
                    </button>
                    <button
                      data-value="3"
                      class="focus-btn w-10 h-10 rounded-xl text-xs font-black transition-all flex items-center justify-center"
                      onclick="Analytics.setFocus('3')"
                    >
                      3
                    </button>
                    <button
                      data-value="4"
                      class="focus-btn w-10 h-10 rounded-xl text-xs font-black transition-all flex items-center justify-center"
                      onclick="Analytics.setFocus('4')"
                    >
                      4
                    </button>
                    <button
                      data-value="5"
                      class="focus-btn w-10 h-10 rounded-xl text-xs font-black transition-all flex items-center justify-center"
                      onclick="Analytics.setFocus('5')"
                    >
                      5
                    </button>
                  </div>
                  <button
                    data-value="after_miss"
                    class="focus-btn px-4 h-12 rounded-xl bg-card-dark border border-subtle text-xs font-bold text-off-white/70 transition-all hover:bg-off-white/10 active:scale-95 flex items-center justify-center whitespace-nowrap"
                    onclick="Analytics.setFocus('after_miss')"
