<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Biathlon Shooting Assistant</title>
    <link rel="manifest" href="manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="assets/icons/app-icon.png" />

    <link rel="icon" href="assets/icons/app-icon.png" type="image/png" />

    <meta name="theme-color" content="#000000" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <script src="js/core/theme-manager.js"></script>
    <script src="js/services/api-service.js"></script>
    <script src="js/services/auth-guard.js"></script>
    <script src="js/core/lang.js"></script>
    <script src="js/utils/utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.28/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/global/global.css" />

    <link rel="stylesheet" href="css/global/desktop.css" />

    <script src="js/core/tailwind-config.js"></script>
  </head>
  <body class="text-off-white min-h-screen flex justify-center items-start">
    <div
      id="app-container"
      class="w-full max-w-[430px] fixed inset-0 mx-auto md:relative md:inset-auto md:h-screen bg-deep-charcoal overflow-hidden flex flex-col shadow-2xl md:rounded-[55px] md:border-[8px] md:border-zinc-800"
    >
      <div id="desktop-main-content" class="flex flex-col flex-1 min-h-0">
        <header class="px-6 pt-2 pb-3 border-b border-subtle">
          <div class="flex items-center gap-4">
            <a
              href="javascript:void(0)"
              onclick="goBack()"
              class="p-2 -ml-2 text-off-white/70 active:scale-90 transition-all"
            >
              <span class="material-symbols-outlined text-[28px]">arrow_back_ios_new</span>
            </a>
            <h1
              class="text-2xl font-bold tracking-tight text-off-white"
              data-i18n="export_performance"
            ></h1>
          </div>
        </header>

        <main class="flex-1 flex flex-col min-h-0 px-6 py-4 space-y-4 overflow-hidden">
          <section class="shrink-0 space-y-3">
            <div class="flex items-center justify-between px-1">
              <h2
                class="text-xs font-black uppercase tracking-widest text-light-blue-info/70"
                data-i18n="export_type"
              ></h2>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <button
                type="button"
                class="export-type-btn rounded-2xl border border-subtle bg-card-dark/80 px-4 py-3 text-left active:scale-[0.99] transition-all"
                data-export-type="pdf"
                aria-pressed="true"
              >
                <div class="flex items-center gap-3">
                  <div
                    class="export-type-icon w-9 h-9 rounded-xl bg-neon-orange/12 flex items-center justify-center text-neon-orange transition-transform duration-200"
                  >
                    <span class="material-symbols-outlined text-xl">picture_as_pdf</span>
                  </div>
                  <div>
                    <p class="font-bold text-sm text-off-white">PDF</p>
                  </div>
                </div>
              </button>
              <button
                type="button"
                class="export-type-btn rounded-2xl border border-subtle bg-card-dark/80 px-4 py-3 text-left active:scale-[0.99] transition-all"
                data-export-type="excel"
              >
                <div class="flex items-center gap-3">
                  <div
                    class="export-type-icon w-9 h-9 rounded-xl bg-neon-green/12 flex items-center justify-center text-neon-green transition-transform duration-200"
                  >
                    <span class="material-symbols-outlined text-xl">table_view</span>
                  </div>
                  <div>
                    <p class="font-bold text-sm text-off-white">Excel</p>
                  </div>
                </div>
              </button>
            </div>
          </section>

          <section
            class="flex-1 flex flex-col min-h-0 rounded-3xl border border-subtle bg-card-dark/80 p-5 space-y-3 overflow-hidden"
          >
            <div class="flex items-center justify-between gap-3 shrink-0">
              <h2
                class="text-xs font-black uppercase tracking-widest text-light-blue-info/70"
                data-i18n="sessions"
              ></h2>
              <div class="flex items-center gap-2">
                <button
                  type="button"
                  id="btn-select-all"
                  class="rounded-full border border-primary/20 bg-primary/10 px-3.5 py-1.5 text-xs font-bold text-primary hover:bg-primary/20 active:scale-95 transition-all cursor-pointer"
                  data-i18n="all"
                ></button>
                <button
                  type="button"
                  id="btn-clear-selection"
                  class="rounded-full border border-subtle bg-white/5 px-3.5 py-1.5 text-xs font-bold text-light-blue-info/70 hover:bg-white/10 active:scale-95 transition-all cursor-pointer"
                  data-i18n="no_selection"
                ></button>
              </div>
            </div>

            <div
              id="export-empty"
              class="hidden rounded-3xl border border-dashed border-white/10 bg-white/5 px-5 py-10 text-center"
            >
              <p class="text-sm font-semibold text-off-white" data-i18n="no_sessions"></p>
              <p
                class="mt-2 text-xs text-light-blue-info/70"
                data-i18n="create_new_session_first"
              ></p>
            </div>

            <div
              id="sessions-list"
              class="flex-1 overflow-y-auto min-h-0 space-y-4 no-scrollbar pr-0.5"
            ></div>
          </section>

        </main>

        <footer
          class="border-t border-subtle bg-card-dark/95 ios-blur px-6 py-4 pb-[max(1rem,env(safe-area-inset-bottom))] space-y-3 shrink-0"
        >
          <div
            class="flex items-center justify-between text-xs font-bold text-light-blue-info/70 px-1"
          >
            <span id="footer-selection-count" data-i18n="selected_sessions_count"></span>
          </div>
          <button
            type="button"
            id="btn-export"
            class="w-full rounded-2xl bg-primary hover:bg-primary/90 px-5 py-3.5 text-white font-bold shadow-lg shadow-primary/25 active:scale-95 transition-all flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer"
          >
            <span class="material-symbols-outlined text-2xl">download</span>
            <span id="btn-export-text" class="text-base font-bold" data-i18n="export"></span>
          </button>
        </footer>
      </div>

      <div
        id="status-toast"
        class="fixed bottom-32 left-1/2 -translate-x-1/2 px-6 py-3 bg-zinc-900/90 border border-white/10 text-off-white text-sm font-semibold rounded-full shadow-2xl transition-all opacity-0 pointer-events-none z-50"
      >
        <span id="status-text" data-i18n="processing_file"></span>
      </div>
    </div>
    <script src="js/pages/inline-1/export-inline-1.js"></script>
    <script src="js/pages/export.js"></script>
  </body>
</html>
