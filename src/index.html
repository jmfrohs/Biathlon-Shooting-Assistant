<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Biathlon Shooting Assistant</title>
    <link rel="manifest" href="manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="assets/icons/app-icon.png" />

    <link rel="icon" href="assets/icons/app-icon.png" type="image/png" />

    <meta name="theme-color" content="#000000" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <script src="js/core/theme-manager.js"></script>
    <script src="js/services/api-service.js"></script>
    <script src="js/services/auth-guard.js"></script>
    <script src="js/services/notification-service.js"></script>
    <script src="js/services/socket-client.js"></script>
    <script src="js/core/lang.js"></script>

    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
    <script src="js/utils/utils.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/global/swipe-styles.css" />

    <link rel="stylesheet" href="css/global/global.css" />

    <link rel="stylesheet" href="css/global/desktop.css" />

    <script src="js/core/tailwind-config.js"></script>
  </head>
  <body class="text-off-white min-h-screen flex justify-center items-start">
    <div
      id="app-container"
      class="w-full max-w-[430px] fixed inset-0 mx-auto md:relative md:inset-auto md:h-screen bg-deep-charcoal overflow-hidden flex flex-col shadow-2xl md:rounded-[55px] md:border-[8px] md:border-zinc-800"
    >
      <div id="desktop-main-content" class="flex flex-col flex-1 min-h-0">
        <div
          class="status-bar px-8 pt-1 pb-1 flex justify-between items-center text-base font-semibold text-off-white"
        ></div>
        <header class="px-6 pt-1 pb-4">
          <div class="flex justify-between items-end">
            <div class="space-y-1">
              <h1
                class="text-3xl font-bold tracking-tight text-off-white"
                data-i18n="sessions"
              ></h1>
              <p class="text-sm text-light-blue-info font-medium" data-i18n="coach_account"></p>
            </div>
            <div class="flex gap-3">
              <button
                id="btn-join-session"
                class="w-11 h-11 flex items-center justify-center rounded-full bg-card-dark border border-subtle text-neon-cyan active:scale-90 transition-all"
              >
                <span class="material-symbols-outlined text-[26px]">link</span>
              </button>
            </div>
          </div>
        </header>
        <div id="search-filter-section" class="px-6 py-2 space-y-5">
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span
                class="material-symbols-outlined text-light-blue-info/40 group-focus-within:text-primary transition-colors"
                >search</span
              >
            </div>
            <input
              id="searchInput"
              class="block w-full pl-10 pr-4 py-3 bg-off-white/5 border border-subtle rounded-2xl text-sm text-off-white placeholder:text-light-blue-info/30 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
              type="text"
              data-i18n="search_sessions_placeholder"
            />
          </div>

          <div class="flex gap-3 overflow-x-auto pb-1 no-scrollbar -mx-1 px-1">
            <button
              data-filter="all"
              class="session-filter-btn px-6 py-2.5 bg-primary text-off-white text-sm font-bold rounded-full whitespace-nowrap active:opacity-80 transition-all"
            ></button>
            <button
              data-filter="competition"
              class="session-filter-btn px-6 py-2.5 bg-card-dark text-off-white text-sm font-semibold rounded-full whitespace-nowrap border border-subtle active:bg-off-white/5 transition-all"
            ></button>
            <button
              data-filter="training"
              class="session-filter-btn px-6 py-2.5 bg-card-dark text-off-white text-sm font-semibold rounded-full whitespace-nowrap border border-subtle active:bg-off-white/5 transition-all"
            ></button>
            <button
              data-filter="test_competition"
              class="session-filter-btn px-6 py-2.5 bg-card-dark text-off-white text-sm font-semibold rounded-full whitespace-nowrap border border-subtle active:bg-off-white/5 transition-all"
            ></button>
            <button
              data-filter="international_test"
              class="session-filter-btn px-6 py-2.5 bg-card-dark text-off-white text-sm font-semibold rounded-full whitespace-nowrap border border-subtle active:bg-off-white/5 transition-all"
            ></button>
            <button
              data-filter="other"
              class="session-filter-btn px-6 py-2.5 bg-card-dark text-off-white text-sm font-semibold rounded-full whitespace-nowrap border border-subtle active:bg-off-white/5 transition-all"
            ></button>
          </div>
        </div>

        <main class="flex-1 overflow-y-auto px-6 py-4 space-y-2 no-scrollbar">
          <div id="sessionsList" class="space-y-1">
            <div
              class="animate-pulse bg-card-dark border border-subtle rounded-2xl p-4 shadow-sm mb-4"
            >
              <div class="flex justify-between items-start mb-3">
                <div class="flex-1 space-y-2">
                  <div class="h-4 bg-off-white/10 rounded w-2/3"></div>
                  <div class="flex items-center gap-1.5 mt-1">
                    <div class="w-3.5 h-3.5 bg-off-white/10 rounded-full"></div>
                    <div class="h-3 bg-off-white/10 rounded w-1/3"></div>
                  </div>
                </div>
                <div class="h-6 bg-off-white/10 rounded-full w-20 ml-2"></div>
              </div>
              <div class="mt-3 pt-3 border-t border-subtle/50 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="flex items-center gap-1.5">
                    <div class="w-4 h-4 bg-off-white/10 rounded-full"></div>
                    <div class="h-3 bg-off-white/10 rounded w-8"></div>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <div class="w-4 h-4 bg-off-white/10 rounded-full"></div>
                    <div class="h-3 bg-off-white/10 rounded w-16"></div>
                  </div>
                </div>
                <div class="w-4 h-4 bg-off-white/10 rounded-full"></div>
              </div>
            </div>
            <div
              class="animate-pulse bg-card-dark border border-subtle rounded-2xl p-4 shadow-sm mb-4"
            >
              <div class="flex justify-between items-start mb-3">
                <div class="flex-1 space-y-2">
                  <div class="h-4 bg-off-white/10 rounded w-1/2"></div>
                  <div class="flex items-center gap-1.5 mt-1">
                    <div class="w-3.5 h-3.5 bg-off-white/10 rounded-full"></div>
                    <div class="h-3 bg-off-white/10 rounded w-1/4"></div>
                  </div>
                </div>
                <div class="h-6 bg-off-white/10 rounded-full w-20 ml-2"></div>
              </div>
              <div class="mt-3 pt-3 border-t border-subtle/50 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="flex items-center gap-1.5">
                    <div class="w-4 h-4 bg-off-white/10 rounded-full"></div>
                    <div class="h-3 bg-off-white/10 rounded w-8"></div>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <div class="w-4 h-4 bg-off-white/10 rounded-full"></div>
                    <div class="h-3 bg-off-white/10 rounded w-16"></div>
                  </div>
                </div>
                <div class="w-4 h-4 bg-off-white/10 rounded-full"></div>
              </div>
            </div>
            <div
              class="animate-pulse bg-card-dark border border-subtle rounded-2xl p-4 shadow-sm mb-4"
            >
              <div class="flex justify-between items-start mb-3">
                <div class="flex-1 space-y-2">
                  <div class="h-4 bg-off-white/10 rounded w-3/4"></div>
                  <div class="flex items-center gap-1.5 mt-1">
                    <div class="w-3.5 h-3.5 bg-off-white/10 rounded-full"></div>
                    <div class="h-3 bg-off-white/10 rounded w-1/3"></div>
                  </div>
                </div>
                <div class="h-6 bg-off-white/10 rounded-full w-20 ml-2"></div>
              </div>
              <div class="mt-3 pt-3 border-t border-subtle/50 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="flex items-center gap-1.5">
                    <div class="w-4 h-4 bg-off-white/10 rounded-full"></div>
                    <div class="h-3 bg-off-white/10 rounded w-8"></div>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <div class="w-4 h-4 bg-off-white/10 rounded-full"></div>
                    <div class="h-3 bg-off-white/10 rounded w-16"></div>
                  </div>
                </div>
                <div class="w-4 h-4 bg-off-white/10 rounded-full"></div>
              </div>
            </div>
          </div>
          <div id="noRecentSessionsMessage" class="py-12 text-center">
            <div
              class="w-16 h-16 bg-off-white/5 rounded-full flex items-center justify-center mx-auto mb-4"
            >
              <span class="material-symbols-outlined text-3xl text-off-white/20">history</span>
            </div>
            <p class="text-light-blue-info/50 text-base italic" data-i18n="no_recent_sessions"></p>
          </div>
        </main>

        <a
          href="new-session.html"
          id="btn-new-session"
          class="absolute bottom-32 right-6 w-16 h-16 bg-primary text-white rounded-full shadow-lg shadow-primary/30 flex items-center justify-center active:scale-90 transition-transform z-30"
        >
          <span class="material-symbols-outlined text-4xl">add</span>
        </a>
      </div>

      <nav
        id="bottom-nav"
        class="bg-card-dark/90 ios-blur border-t border-subtle px-6 flex justify-around items-center z-40 shrink-0"
      >
        <a
          href="athletes.html"
          id="nav-athletes"
          class="flex flex-col items-center gap-1.5 text-light-blue-info flex-1 touch-target active:opacity-60"
        >
          <span class="material-symbols-outlined text-[30px]">groups</span>
          <span class="text-[11px] font-semibold" data-i18n="athletes"></span>
        </a>
        <a
          href="calendar.html"
          id="nav-calendar"
          class="flex flex-col items-center gap-1.5 text-light-blue-info flex-1 touch-target active:opacity-60"
        >
          <span class="material-symbols-outlined text-[30px]">calendar_month</span>
          <span class="text-[11px] font-semibold" data-i18n="calendar_title"></span>
        </a>
        <a
          href="index.html"
          id="nav-sessions"
          class="flex flex-col items-center gap-1.5 text-primary flex-1 touch-target active:opacity-60"
        >
          <span
            class="material-symbols-outlined text-[30px]"
            style="font-variation-settings: 'FILL' 1"
            >event_note</span
          >
          <span class="text-[11px] font-bold" data-i18n="sessions"></span>
        </a>
        <a
          href="analytics.html"
          id="nav-analytics"
          class="flex flex-col items-center gap-1.5 text-light-blue-info flex-1 touch-target active:opacity-60"
        >
          <span class="material-symbols-outlined text-[30px]">analytics</span>
          <span class="text-[11px] font-semibold" data-i18n="analytics"></span>
        </a>
        <a
          href="menu.html"
          id="nav-menu"
          class="flex flex-col items-center gap-1.5 text-light-blue-info flex-1 touch-target active:opacity-60"
        >
          <span class="material-symbols-outlined text-[30px]">more_horiz</span>
          <span class="text-[11px] font-semibold" data-i18n="more"></span>
        </a>
      </nav>
      <div
        id="joinSessionModal"
        class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-[100] p-6"
      >
        <div
          class="bg-card-dark w-full max-w-sm rounded-[32px] border border-subtle shadow-2xl p-8 flex flex-col items-center gap-6 animate-in zoom-in duration-300"
        >
          <div class="w-16 h-16 bg-neon-cyan/10 rounded-full flex items-center justify-center">
            <span class="material-symbols-outlined text-neon-cyan text-4xl">link</span>
          </div>
          <div class="text-center space-y-2">
            <h2 class="text-xl font-bold text-off-white" data-i18n="join_session"></h2>
            <p class="text-sm text-light-blue-info/70" data-i18n="enter_5_digit_code"></p>
          </div>
          <input
            type="text"
            id="joinCodeInput"
            maxlength="5-digit"
            placeholder="-----"
            class="w-full bg-deep-charcoal border-2 border-primary/30 rounded-2xl px-4 py-5 text-4xl font-black text-center text-primary tracking-[0.5em] focus:border-primary outline-none transition-all placeholder:text-primary/20"
          />
          <div class="flex gap-3 w-full">
            <button
              id="btn-cancel-join"
              class="flex-1 py-4 rounded-xl bg-white/5 text-off-white font-bold active:scale-95 transition-all text-sm"
              data-i18n="cancel"
            ></button>
            <button
              id="btn-confirm-join"
              class="flex-[2] py-4 rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/20 active:scale-95 transition-all text-sm"
              data-i18n="join_session"
            ></button>
          </div>
        </div>
      </div>
    </div>
    <script src="js/pages/inline-1/index-inline-1.js"></script>
    <script src="js/pages/sessions.js"></script>
    <script src="js/managers/target-manager.js"></script>
    <script src="js/core/constants.js"></script>
    <script src="js/pages/app.js"></script>
    <script type="module" src="js/pages/index-inline-module-1.js"></script>
  </body>
</html>
