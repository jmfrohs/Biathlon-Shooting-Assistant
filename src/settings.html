<!doctype html>
<html class="dark" lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Biathlon Shooting Assistant</title>
    <link rel="manifest" href="manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="assets/icons/app-icon.png" />

    <link rel="icon" href="assets/icons/app-icon.png" type="image/png" />

    <meta name="theme-color" content="#000000" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <script src="js/core/theme-manager.js"></script>
    <script src="js/services/api-service.js"></script>
    <script src="js/services/auth-guard.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/global/global.css" />

    <link rel="stylesheet" href="css/global/desktop.css" />
    <script src="js/core/lang.js"></script>
    <script src="js/utils/utils.js"></script>
    <script src="js/core/constants.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/core/tailwind-config.js"></script>

    <link rel="stylesheet" href="css/pages/settings-inline.css" />
  </head>
  <body class="text-off-white min-h-screen flex justify-center items-start">
    <div
      id="app-container"
      class="w-full max-w-[430px] fixed inset-0 mx-auto md:relative md:inset-auto md:h-screen bg-deep-charcoal overflow-hidden flex flex-col shadow-2xl md:rounded-[55px] md:border-[8px] md:border-zinc-800"
    >
      <div id="desktop-main-content" class="flex flex-col flex-1 min-h-0">
        <div
          class="status-bar px-8 pt-1 pb-1 flex justify-between items-center text-base font-semibold text-off-white"
        ></div>

        <header class="px-6 pt-2 pb-3 border-b border-subtle/40 shrink-0">
          <div class="flex items-center gap-4">
            <button
              type="button"
              onclick="navigateBack()"
              class="p-2 -ml-2 text-off-white/70 active:scale-90 transition-all"
              aria-label="Zurück"
            >
              <span class="material-symbols-outlined text-[28px]">arrow_back_ios_new</span>
            </button>
            <div>
              <h1
                class="text-3xl font-bold tracking-tight text-off-white"
                data-i18n="settings"
              ></h1>
            </div>
          </div>
        </header>

        <main class="flex-1 overflow-y-auto px-6 py-4 space-y-6 no-scrollbar">
          <section class="space-y-2">
            <h2
              class="px-2 text-[13px] font-semibold uppercase tracking-wider text-light-blue-info/70"
              data-i18n="server_connection"
            ></h2>
            <div
              class="bg-card-dark divide-y divide-border-subtle rounded-2xl border border-subtle overflow-hidden"
            >
              <div class="p-4">
                <div class="flex items-center gap-3 mb-3">
                  <div class="w-8 h-8 rounded-lg bg-cyan-500/20 flex items-center justify-center">
                    <span class="material-symbols-outlined text-cyan-400 text-xl">dns</span>
                  </div>
                  <div class="flex-1">
                    <span class="text-off-white font-medium" data-i18n="server_ip"></span>
                    <div id="server-connection-status" class="flex items-center gap-2 text-xs mt-1">
                      <span id="server-conn-dot" class="w-2 h-2 rounded-full bg-zinc-600"></span>
                      <span id="server-conn-text" class="text-light-blue-info/50"></span>
                    </div>
                  </div>
                </div>
                <div class="flex flex-col gap-3">
                  <div class="grid grid-cols-1 gap-3" id="server-presets-grid">
                    <div
                      onclick="
                        document.getElementById('server-ip-input').value =
                          'https://biathlon-shooting-assistant.duckdns.org';
                        connectToServer();
                      "
                      class="server-card p-4 bg-card-dark border border-subtle rounded-2xl cursor-pointer hover:border-primary/50 transition-all active:scale-95 group relative overflow-hidden"
                    >
                      <div
                        class="absolute right-0 top-0 w-24 h-24 bg-primary/5 rounded-full -mr-12 -mt-12 transition-transform group-hover:scale-110"
                      ></div>
                      <div class="flex items-center gap-4 relative z-10">
                        <div
                          class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center text-primary"
                        >
                          <span class="material-symbols-outlined">cloud</span>
                        </div>
                        <div>
                          <h3
                            class="text-sm font-bold text-off-white"
                            data-i18n="default_server"
                          ></h3>
                          <p
                            class="text-[10px] text-light-blue-info/60 font-medium"
                            data-i18n="default_server_desc"
                          ></p>
                        </div>
                        <div class="ml-auto">
                          <span
                            class="material-symbols-outlined text-primary opacity-0 group-hover:opacity-100 transition-opacity"
                            >chevron_right</span
                          >
                        </div>
                      </div>
                    </div>
                    <div
                      onclick="selectServer('http://localhost:3001', 'Lokaler Host')"
                      class="server-card p-4 bg-card-dark border border-subtle rounded-2xl cursor-pointer hover:border-primary/50 transition-all active:scale-95 group relative overflow-hidden"
                    >
                      <div class="flex items-center gap-4 relative z-10">
                        <div
                          class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-light-blue-info"
                        >
                          <span class="material-symbols-outlined">home_app_logo</span>
                        </div>
                        <div>
                          <h3 class="text-sm font-bold text-off-white" data-i18n="local_host"></h3>
                          <p
                            class="text-[10px] text-light-blue-info/60 font-medium"
                            data-i18n="local_host_desc"
                          ></p>
                        </div>
                        <div class="ml-auto">
                          <span
                            class="material-symbols-outlined text-primary opacity-0 group-hover:opacity-100 transition-opacity"
                            >chevron_right</span
                          >
                        </div>
                      </div>
                    </div>
                  </div>
                  <div id="server-history-container" class="hidden">
                    <label
                      class="block text-[10px] font-bold text-light-blue-info/40 uppercase tracking-widest mb-2 px-1"
                      data-i18n="last_used"
                    ></label>
                    <div id="server-history-list" class="flex flex-wrap gap-2"></div>
                  </div>
                  <div class="relative">
                    <input
                      type="text"
                      id="server-ip-input"
                      placeholder="91.99.192.176:3001"
                      class="w-full bg-off-white/5 border border-subtle rounded-xl px-3 py-3 text-sm text-off-white placeholder:text-light-blue-info/40 focus:outline-none focus:border-primary"
                    />
                  </div>
                </div>
              </div>
              <div class="p-4">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <div
                      class="w-8 h-8 rounded-lg bg-amber-500/20 flex items-center justify-center"
                    >
                      <span class="material-symbols-outlined text-amber-400 text-xl"
                        >network_check</span
                      >
                    </div>
                    <div class="flex flex-col">
                      <span
                        class="text-off-white font-medium"
                        data-i18n="auto_network_fallback"
                      ></span>
                      <span
                        id="auto-network-fallback-state"
                        class="text-xs text-zinc-500 mt-1"
                      ></span>
                    </div>
                  </div>
                  <button
                    type="button"
                    onclick="toggleAutoNetworkFallback()"
                    id="auto-network-fallback-toggle"
                    class="w-11 h-6 bg-zinc-700 rounded-full relative transition-colors duration-200"
                  >
                    <span
                      id="auto-network-fallback-knob"
                      class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform duration-200"
                    ></span>
                  </button>
                </div>
              </div>
              <div id="server-connect-area" class="p-4"></div>
              <div id="server-disconnect-area" class="p-4 hidden">
                <button
                  onclick="disconnectFromServer()"
                  class="w-full bg-red-500/10 border border-red-500/30 font-bold py-3 rounded-xl active:scale-95 transition-transform flex items-center justify-center gap-2"
                >
                  <span class="material-symbols-outlined text-xl">link_off</span>
                  <span data-i18n="disconnect"></span>
                </button>
              </div>
            </div>
          </section>

          <section class="space-y-2">
            <h2
              class="px-2 text-[13px] font-semibold uppercase tracking-wider text-light-blue-info/70"
              data-i18n="general"
            ></h2>
            <div
              class="bg-card-dark divide-y divide-border-subtle rounded-2xl border border-subtle overflow-hidden"
            >
              <div
                class="p-4 flex items-center justify-between hover:bg-off-white/5 transition-colors cursor-pointer"
                onclick="openLanguageModal()"
              >
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 rounded-lg bg-zinc-500/20 flex items-center justify-center">
                    <span class="material-symbols-outlined text-zinc-400 text-xl">language</span>
                  </div>
                  <span class="text-off-white font-medium" data-i18n="language"></span>
                </div>
                <div class="flex items-center gap-1">
                  <span id="language-display" class="text-light-blue-info text-sm"></span>
                  <span class="material-symbols-outlined text-zinc-600">chevron_right</span>
                </div>
              </div>
              <div
                class="p-4 flex items-center justify-between hover:bg-off-white/5 transition-colors cursor-pointer"
                onclick="confirmClearAllData()"
              >
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 rounded-lg bg-red-500/20 flex items-center justify-center">
                    <span class="material-symbols-outlined text-red-500 text-xl">delete</span>
                  </div>
                  <span class="text-off-white font-medium" data-i18n="clear_data"></span>
                </div>
                <span class="material-symbols-outlined text-zinc-600">chevron_right</span>
              </div>
            </div>
          </section>

        </main>

      </div>

      <div
        id="clear-data-modal"
        class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center px-6"
        onclick="closeClearDataModal(event)"
      >
        <div
          class="bg-card-dark rounded-3xl p-6 max-w-sm w-full border border-subtle"
          onclick="event.stopPropagation()"
        >
          <div class="flex items-center gap-3 mb-4">
            <div class="w-12 h-12 rounded-full bg-red-500/20 flex items-center justify-center">
              <span class="material-symbols-outlined text-red-500 text-2xl">warning</span>
            </div>
            <h3 class="text-xl font-bold text-off-white" data-i18n="confirm_delete_title"></h3>
          </div>
          <p class="text-sm text-zinc-400 mb-4" data-i18n="confirm_delete_msg"></p>
          <p class="text-sm text-off-white font-semibold mb-2">
            <span data-i18n="type_delete_pre"></span
            ><span class="text-red-500 font-bold">DELETE</span
            ><span data-i18n="type_delete_post"></span>
          </p>
          <input
            type="text"
            id="delete-confirmation-input"
            data-i18n-placeholder="type_delete"
            class="w-full bg-off-white/5 border border-subtle rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500 mb-4 text-off-white"
            autocomplete="off"
          />
          <div class="flex gap-3">
            <button
              onclick="closeClearDataModal()"
              class="flex-1 bg-off-white/5 text-off-white py-3 rounded-xl font-semibold active:scale-95 transition-transform"
              data-i18n="cancel"
            ></button>
            <button
              onclick="executeClearAllData()"
              class="flex-1 bg-red-500 text-off-white py-3 rounded-xl font-semibold active:scale-95 transition-transform"
              data-i18n="delete_all"
            ></button>
          </div>
        </div>
      </div>

      <div
        id="language-modal"
        class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center px-6"
        onclick="closeLanguageModal(event)"
      >
        <div
          class="bg-card-dark rounded-3xl p-6 max-w-sm w-full border border-subtle"
          onclick="event.stopPropagation()"
        >
          <h3 class="text-xl font-bold text-off-white mb-4" data-i18n="select_lang"></h3>
          <div class="space-y-3">
            <button
              onclick="setLanguage('de')"
              id="lang-de-btn"
              class="w-full p-4 bg-off-white/5 hover:bg-off-white/10 rounded-xl border border-subtle text-left transition-all active:scale-95 flex items-center justify-between"
            >
              <span class="text-off-white font-semibold">Deutsch</span>
              <span class="material-symbols-outlined text-primary text-2xl hidden" id="check-de"
                >check_circle</span
              >
            </button>
            <button
              onclick="setLanguage('en')"
              id="lang-en-btn"
              class="w-full p-4 bg-off-white/5 hover:bg-off-white/10 rounded-xl border border-subtle text-left transition-all active:scale-95 flex items-center justify-between"
            >
              <span class="text-off-white font-semibold">English</span>
              <span class="material-symbols-outlined text-primary text-2xl hidden" id="check-en"
                >check_circle</span
              >
            </button>
          </div>
          <button
            onclick="closeLanguageModal()"
            class="w-full mt-4 bg-off-white/5 text-off-white py-3 rounded-xl font-semibold active:scale-95 transition-transform"
            data-i18n="close"
          ></button>
        </div>
      </div>
    </div>
  </body>
</html>
